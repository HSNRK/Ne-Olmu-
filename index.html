<title>Ne Olmuş</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{background:#0a0a0a;color:#e8e4dc;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;min-height:100vh;-webkit-tap-highlight-color:transparent}
button{cursor:pointer;border:none;outline:none;background:none}
a{text-decoration:none;-webkit-tap-highlight-color:transparent}

/* HEADER */
#hdr{display:flex;align-items:center;gap:10px;padding:12px 14px 10px;background:#0a0a0a;position:sticky;top:0;z-index:200;border-bottom:1px solid #1a1a1a}
.app-title{font-size:26px;font-weight:800;letter-spacing:-.5px;color:#fff;line-height:1}
.clk{font-size:11px;color:#555;margin-top:2px}
.hdr-r{display:flex;gap:7px;margin-left:auto;flex-shrink:0}
.pill{display:flex;align-items:center;gap:5px;background:#1c1c1e;color:#e8e4dc;padding:7px 11px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap;border:none}
.pill.on{background:#1a2e1a;color:#5cba5c}

/* UPDATE BAR */
#upd{display:flex;padding:5px 14px;font-size:11px;color:#333;border-bottom:1px solid #141414}
#upd-t{color:#555;margin-left:auto}

/* ACCORDION */
.acc{border-bottom:1px solid #1a1a1a}
.acc-hd{display:flex;align-items:center;gap:10px;padding:13px 14px;cursor:pointer;user-select:none;-webkit-user-select:none}
.acc-ico{font-size:18px;flex-shrink:0}
.acc-lbl{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#666;flex:1}
.acc-bdg{background:#c0392b;color:#fff;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:700}
.acc-chv{color:#444;font-size:12px;flex-shrink:0}
.acc-body{display:none;padding:0 14px 14px}
.acc-body.open{display:block}

/* TABS */
#tabs{display:flex;padding:0 6px;background:#0a0a0a;border-bottom:1px solid #1a1a1a;position:sticky;top:67px;z-index:100}
.tab{flex:1;display:flex;align-items:center;justify-content:center;gap:4px;padding:11px 2px;background:transparent;border:none;border-bottom:2px solid transparent;color:#555;font-size:12px;font-weight:600}
.tab.on{border-bottom-color:#c0392b;color:#fff}

/* MAIN */
#main{padding:0 14px 30px}
.n-head{display:flex;align-items:center;gap:10px;padding:16px 0 12px;border-bottom:1px solid #1a1a1a;margin-bottom:4px}
.n-title{font-size:22px;font-weight:800;color:#fff}
.n-cnt{background:#222;color:#888;padding:3px 9px;border-radius:12px;font-size:11px;font-weight:600}
.note{font-size:10px;color:#3a5a3a;font-style:italic;margin-bottom:12px}
.spin{width:16px;height:16px;border:2px solid #222;border-top-color:#c0392b;border-radius:50%;animation:spin .8s linear infinite;display:none;flex-shrink:0}
.spin.on{display:block}
@keyframes spin{to{transform:rotate(360deg)}}

/* SKELETON */
.sk-wrap{padding:14px 0;border-bottom:1px solid #111}
.sk{background:#181818;border-radius:5px;animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.6}50%{opacity:.2}}

/* NEWS CARD */
.nc{padding:13px 0;border-bottom:1px solid #131313}
.nc-top{display:flex;align-items:center;gap:8px;margin-bottom:5px;flex-wrap:wrap}
.nc-src{font-size:10px;font-weight:700;color:#fff;background:#c0392b;padding:2px 7px;border-radius:4px;text-transform:uppercase;letter-spacing:.04em;flex-shrink:0}
.nc-src.x-src{background:#000;border:1px solid #333}
.nc-dt{font-size:10px;color:#333}
.nc-ti{font-size:14px;font-weight:700;line-height:1.45;color:#e8e4dc;cursor:pointer;margin-bottom:6px}
.nc-sm{font-size:12px;line-height:1.7;color:#666;margin-bottom:8px;display:none}
.nc-sm.on{display:block}
.nc-ac{display:flex;gap:10px;align-items:center}
.btn-oz{background:#1a1a1a;color:#777;padding:5px 12px;border-radius:14px;font-size:11px;font-weight:600;border:none;cursor:pointer}
.nc-lk{font-size:11px;color:#c0392b;font-weight:600}

/* HISTORY */
.hi{display:flex;gap:14px;padding:10px 0;border-bottom:1px solid #141414}
.hi-yr{min-width:48px;font-size:20px;font-weight:800;color:#c0392b;flex-shrink:0;line-height:1.2}
.hi-tx{font-size:13px;line-height:1.75;color:#b0aca4}

/* FOLK CALENDAR */
.ev{margin-bottom:8px;border-radius:10px;overflow:hidden;border:1px solid #1c1c1c;background:#111}
.ev.hot{border-color:rgba(192,57,43,.4);background:#120a08}
.ev-hd{display:flex;align-items:center;gap:10px;padding:12px;cursor:pointer;user-select:none;-webkit-user-select:none}
.ev-ic{font-size:22px;min-width:28px}
.ev-mt{flex:1;min-width:0}
.ev-nm{font-size:13px;font-weight:700;display:block;margin-bottom:2px;color:#e8e4dc}
.ev-dt{color:#3a3a3a;font-size:10px;display:block;margin-bottom:1px}
.ev-sh{color:#555;font-size:10px;display:block}
.ev-bg{color:#fff;padding:3px 8px;border-radius:10px;font-size:9px;font-weight:700;white-space:nowrap;flex-shrink:0}
.ev-cv{color:#2e2e2e;font-size:11px;margin-left:4px;flex-shrink:0}
.ev-bd{display:none;padding:0 12px 12px 52px;border-top:1px solid #181818}
.ev-bd.on{display:block}
.ev-fl{font-size:12px;line-height:1.85;color:#888;margin-top:10px}
.ev-tg{display:inline-block;margin-top:6px;background:#1a1a1a;border-radius:3px;padding:2px 6px;font-size:9px;color:#444}

/* X DRAWER */
#xdrawer{display:none;position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.85)}
#xdrawer.open{display:flex;align-items:flex-end}
#xpanel{background:#111;width:100%;border-radius:20px 20px 0 0;padding:20px 16px 36px;max-height:82vh;overflow-y:auto}
.xp-title{font-size:17px;font-weight:800;color:#fff;margin-bottom:3px}
.xp-sub{font-size:11px;color:#555;margin-bottom:14px}
.xa-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #1a1a1a}
.xa-name{flex:1;font-size:14px;font-weight:600;color:#e8e4dc}
.xa-lang{font-size:10px;color:#888;background:#1c1c1e;padding:2px 7px;border-radius:8px}
.xa-del{color:#c0392b;font-size:20px;font-weight:700;line-height:1;padding:0 4px;background:none;border:none;cursor:pointer}
.xa-add{display:flex;gap:8px;margin-top:14px}
.xa-inp{flex:1;background:#0a0a0a;border:1px solid #2a2a2a;color:#e8e4dc;padding:10px 12px;border-radius:10px;font-size:13px;outline:none}
.xa-inp:focus{border-color:#c0392b}
.xa-sel{background:#0a0a0a;border:1px solid #2a2a2a;color:#aaa;padding:10px 8px;border-radius:10px;font-size:12px;outline:none}
.btn-xa{background:#c0392b;color:#fff;padding:10px 14px;border-radius:10px;font-size:12px;font-weight:700;border:none;cursor:pointer;white-space:nowrap}
.btn-xclose{width:100%;background:#1c1c1e;color:#888;padding:12px;border-radius:12px;font-size:13px;font-weight:600;border:none;cursor:pointer;margin-top:12px}
.x-head{display:flex;align-items:center;justify-content:space-between;padding:16px 0 12px;border-bottom:1px solid #1a1a1a;margin-bottom:4px}
.btn-xmanage{display:flex;align-items:center;gap:5px;background:#1c1c1e;color:#aaa;padding:6px 12px;border-radius:14px;font-size:11px;font-weight:600;border:none;cursor:pointer}

/* TOAST */
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);z-index:9999;background:#fff;color:#111;padding:10px 20px;border-radius:20px;font-size:13px;font-weight:600;box-shadow:0 4px 24px rgba(0,0,0,.6);display:none;max-width:90vw;text-align:center}
#toast.on{display:block;animation:tup .25s ease}
@keyframes tup{from{opacity:0;transform:translateX(-50%) translateY(8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

#sbar{font-size:10px;color:#2a2a2a;padding:3px 14px;min-height:18px}
.empty{color:#444;font-size:13px;padding:24px 0;text-align:center;line-height:1.9}
.stale-note{font-size:10px;color:#3a3a20;font-style:italic;padding:4px 0 8px}
</style>

<script>
(function() {
"use strict";

/* ════ KAYNAKLAR ════ */
var TR_FEEDS = [
  {n:"Hurriyet",  u:"https://www.hurriyet.com.tr/rss/anasayfa"},
  {n:"NTV",       u:"https://www.ntv.com.tr/son-dakika.rss"},
  {n:"Sozcu",     u:"https://www.sozcu.com.tr/rss.xml"},
  {n:"Haberturk", u:"https://www.haberturk.com/rss"}
];
var WO_FEEDS = [
  {n:"BBC World",   u:"https://feeds.bbci.co.uk/news/world/rss.xml"},
  {n:"NY Times",    u:"https://rss.nytimes.com/services/xml/rss/nyt/World.xml"},
  {n:"Sky News",    u:"https://feeds.skynews.com/feeds/rss/world.xml"},
  {n:"Al Jazeera",  u:"https://www.aljazeera.com/xml/rss/all.xml"},
  {n:"CNN Intl",    u:"https://rss.cnn.com/rss/edition_world.rss"}
];
var X_DEFAULT = [
  {u:"AJENews",      lang:"en"},
  {u:"cnnnbrk",      lang:"en"},
  {u:"BBCBreaking",  lang:"en"},
  {u:"steve_hanke",  lang:"en"},
  {u:"ntv",          lang:"tr"},
  {u:"gazetesozcu",  lang:"tr"},
  {u:"Hurriyet",     lang:"tr"}
];

/* ════ PROXY ════ */
var PROXIES = [
  function(u){ return "https://api.allorigins.win/raw?url=" + encodeURIComponent(u); },
  function(u){ return "https://corsproxy.io/?" + encodeURIComponent(u); },
  function(u){ return "https://api.codetabs.com/v1/proxy?quest=" + encodeURIComponent(u); }
];

/* ════ iOS UYUMLU FETCH ════ */
function tfetch(url, ms) {
  var ctrl = new AbortController();
  var tid = setTimeout(function() { ctrl.abort(); }, ms || 10000);
  return fetch(url, {signal: ctrl.signal})
    .then(function(r) { clearTimeout(tid); return r; })
    .catch(function(e) { clearTimeout(tid); throw e; });
}

/* ════ ÖNBELLEK (localStorage) ════ */
function lsGet(k, maxMs) {
  try {
    var raw = localStorage.getItem("no8_" + k);
    if (!raw) return null;
    var obj = JSON.parse(raw);
    if (Date.now() - obj.t < (maxMs || 3600000)) return obj.v;
    return null;
  } catch(e) { return null; }
}
function lsGetOld(k) {
  try {
    var raw = localStorage.getItem("no8_" + k);
    if (!raw) return null;
    var obj = JSON.parse(raw);
    return {v: obj.v || null, t: obj.t || 0};
  } catch(e) { return null; }
}
function lsSet(k, v) {
  try { localStorage.setItem("no8_" + k, JSON.stringify({v: v, t: Date.now()})); } catch(e) {}
}
function lsDel(k) {
  try { localStorage.removeItem("no8_" + k); } catch(e) {}
}

/* ════ ARAÇLAR ════ */
function esc(s) {
  var d = document.createElement("div");
  d.textContent = String(s || "");
  return d.innerHTML;
}
function cleanText(h) {
  if (!h) return "";
  h = h.replace(/<!\[CDATA\[([\s\S]*?)\]\]>/g, "$1");
  h = h.replace(/<[^>]+>/g, " ");
  var t = document.createElement("textarea");
  t.innerHTML = h;
  return t.value.replace(/\s+/g, " ").trim();
}
function ago(d) {
  try {
    var dt = new Date(d);
    if (isNaN(dt.getTime())) return "";
    var m = Math.floor((Date.now() - dt.getTime()) / 60000);
    if (m < 1) return "az once";
    if (m < 60) return m + " dk once";
    if (m < 1440) return Math.floor(m / 60) + " sa once";
    return dt.toLocaleDateString("tr-TR", {day:"numeric", month:"short"});
  } catch(e) { return ""; }
}
function fmtDM(d)  { return d.toLocaleDateString("tr-TR", {day:"numeric", month:"long"}); }
function fmtDMY(d) { return d.toLocaleDateString("tr-TR", {day:"numeric", month:"long", year:"numeric"}); }
function sbar(m)   { document.getElementById("sbar").textContent = m || ""; }

/* ════ RSS ÇEKME ════ */
function fetchOneFeed(feedUrl, proxyIdx) {
  if (proxyIdx === undefined) proxyIdx = 0;
  if (proxyIdx >= PROXIES.length) return Promise.resolve("");
  var url = PROXIES[proxyIdx](feedUrl);
  return tfetch(url, 10000)
    .then(function(r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.text();
    })
    .then(function(txt) {
      if (txt && txt.trim().charAt(0) === "{") {
        try { txt = JSON.parse(txt).contents || txt; } catch(e2) {}
      }
      if (!txt || txt.length < 100 || (!txt.includes("<item") && !txt.includes("<entry"))) {
        throw new Error("bad content");
      }
      return txt;
    })
    .catch(function() {
      return fetchOneFeed(feedUrl, proxyIdx + 1);
    });
}

function parseRSS(xml, name) {
  try {
    var doc = new DOMParser().parseFromString(xml, "text/xml");
    if (doc.querySelector("parsererror")) {
      doc = new DOMParser().parseFromString(xml, "text/html");
    }
    var items = Array.prototype.slice.call(doc.querySelectorAll("item, entry"));
    var out = [];
    for (var i = 0; i < Math.min(items.length, 4); i++) {
      var item = items[i];
      var titleEl = item.querySelector("title");
      var title = cleanText(titleEl ? titleEl.textContent : "");
      if (!title || title.length < 4) continue;
      var url = "";
      var linkEl = item.querySelector("link");
      if (linkEl) url = linkEl.getAttribute("href") || cleanText(linkEl.textContent) || "";
      if (!url || url.indexOf("http") !== 0) {
        var gEl = item.querySelector("guid");
        if (gEl) { var gv = cleanText(gEl.textContent); if (gv.indexOf("http") === 0) url = gv; }
      }
      var descEl = item.querySelector("description") || item.querySelector("summary") || item.querySelector("content");
      var summary = descEl ? cleanText(descEl.textContent).slice(0, 200) : "";
      var dateEl = item.querySelector("pubDate") || item.querySelector("published") || item.querySelector("updated");
      var pub = dateEl ? new Date(cleanText(dateEl.textContent)) : new Date();
      if (isNaN(pub.getTime())) pub = new Date();
      out.push({title: title, summary: summary, url: url, source: name, pub: pub.toISOString()});
    }
    return out;
  } catch(e) { return []; }
}

function loadFeed(src) {
  return fetchOneFeed(src.u).then(function(xml) {
    return xml ? parseRSS(xml, src.n) : [];
  });
}

/* ════ ÇEVİRİ ════ */
function translate(text) {
  return new Promise(function(resolve) {
    if (!text || text.length < 4) { resolve(text); return; }
    var clean = text.slice(0, 400);
    var ck = "tx8_" + clean.slice(0, 20).replace(/[^a-z0-9]/gi, "");
    var hit = lsGet(ck, 86400000);
    if (hit) { resolve(hit); return; }
    var url = "https://api.mymemory.translated.net/get?q=" + encodeURIComponent(clean) + "&langpair=en|tr";
    tfetch(url, 8000)
      .then(function(r) { return r.json(); })
      .then(function(d) {
        if (d.responseStatus === 200 && d.responseData && d.responseData.translatedText) {
          lsSet(ck, d.responseData.translatedText);
          resolve(d.responseData.translatedText);
        } else { resolve(text); }
      })
      .catch(function() { resolve(text); });
  });
}

/* ════ TÜRK HABERLERİ ════ */
function loadTR() {
  return new Promise(function(resolve) {
    var c = lsGet("tr", 3600000);
    if (c) { resolve({data: c, stale: false}); return; }
    setSpin("tr", true);
    Promise.all(TR_FEEDS.map(function(f) { return loadFeed(f); }))
      .then(function(results) {
        var all = [];
        results.forEach(function(r) { all = all.concat(r); });
        all.sort(function(a, b) { return new Date(b.pub) - new Date(a.pub); });
        all = all.slice(0, 10);
        setSpin("tr", false);
        if (all.length) { lsSet("tr", all); resolve({data: all, stale: false}); }
        else {
          var old = lsGetOld("tr");
          resolve({data: old ? old.v : [], stale: true, savedAt: old ? old.t : 0});
        }
      });
  });
}

/* ════ DÜNYA HABERLERİ ════ */
function loadWorld() {
  return new Promise(function(resolve) {
    var c = lsGet("wo", 3600000);
    if (c) { resolve({data: c, stale: false}); return; }
    setSpin("wo", true);
    Promise.all(WO_FEEDS.map(function(f) { return loadFeed(f); }))
      .then(function(results) {
        var all = [];
        results.forEach(function(r) { all = all.concat(r); });
        all.sort(function(a, b) { return new Date(b.pub) - new Date(a.pub); });
        all = all.slice(0, 10);
        return Promise.all(all.map(function(item) {
          return translate(item.title).then(function(tr) {
            return {title: tr, summary: item.summary, url: item.url, source: item.source, pub: item.pub};
          });
        }));
      })
      .then(function(translated) {
        setSpin("wo", false);
        if (translated.length) { lsSet("wo", translated); resolve({data: translated, stale: false}); }
        else {
          var old = lsGetOld("wo");
          resolve({data: old ? old.v : [], stale: true, savedAt: old ? old.t : 0});
        }
      });
  });
}

/* ════ TARİHTE BUGÜN ════ */
function loadHist() {
  return new Promise(function(resolve) {
    var today = new Date();
    var m = today.getMonth() + 1, d = today.getDate();
    var ck = "hist_" + m + "_" + d;
    var c = lsGet(ck, 43200000);
    if (c) { resolve(c); return; }
    tfetch("https://tr.wikipedia.org/api/rest_v1/feed/onthisday/events/" + m + "/" + d, 10000)
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if (!data.events || !data.events.length) throw new Error("empty");
        var evts = data.events
          .map(function(e) { return {year: parseInt(e.year) || 0, event: e.text}; })
          .filter(function(e) { return e.year > 0 && e.event; })
          .sort(function(a, b) { return b.year - a.year; })
          .slice(0, 12);
        lsSet(ck, evts);
        resolve(evts);
      })
      .catch(function() {
        tfetch("https://en.wikipedia.org/api/rest_v1/feed/onthisday/events/" + m + "/" + d, 10000)
          .then(function(r) { return r.json(); })
          .then(function(data) {
            if (!data.events || !data.events.length) { resolve([]); return; }
            var picked = data.events
              .map(function(e) { return {year: parseInt(e.year) || 0, event: e.text}; })
              .filter(function(e) { return e.year > 0; })
              .sort(function(a, b) { return b.year - a.year; })
              .slice(0, 12);
            Promise.all(picked.map(function(e) {
              return translate(e.event).then(function(tr) { return {year: e.year, event: tr}; });
            })).then(function(evts) { lsSet(ck, evts); resolve(evts); });
          })
          .catch(function() { resolve([]); });
      });
  });
}

/* ════ X (TWITTER) ════ */
function getXAccounts() {
  try {
    var raw = localStorage.getItem("no8_xaccounts");
    if (raw) return JSON.parse(raw);
  } catch(e) {}
  return X_DEFAULT.slice();
}
function saveXAccounts(arr) {
  try { localStorage.setItem("no8_xaccounts", JSON.stringify(arr)); } catch(e) {}
}

function openXDrawer() {
  renderXDrawer();
  document.getElementById("xdrawer").classList.add("open");
}
function closeXDrawer() {
  document.getElementById("xdrawer").classList.remove("open");
  lsDel("xt");
  loadXTab();
}
function xDrawerBg(e) {
  if (e.target === document.getElementById("xdrawer")) closeXDrawer();
}

function renderXDrawer() {
  var accts = getXAccounts();
  var el = document.getElementById("xa-list");
  if (!accts.length) {
    el.innerHTML = "<p style=\"color:#333;font-size:12px;padding:8px 0\">Henuz hesap eklenmedi.</p>";
  } else {
    el.innerHTML = accts.map(function(a, i) {
      return "<div class=\"xa-row\">" +
        "<span class=\"xa-name\">@" + esc(a.u) + "</span>" +
        "<span class=\"xa-lang\">" + (a.lang === "tr" ? "🇹🇷 TR" : "🌍 Ceviri") + "</span>" +
        "<button class=\"xa-del\" onclick=\"delXAcct(" + i + ")\">&#215;</button>" +
        "</div>";
    }).join("");
  }
  document.getElementById("xa-add").style.display = accts.length >= 10 ? "none" : "flex";
}

function addXAcct() {
  var inp = document.getElementById("xa-inp");
  var lang = document.getElementById("xa-lang").value;
  var raw = inp.value.replace(/^@/, "").trim();
  if (!raw) { toast("Kullanici adi girin"); return; }
  var accts = getXAccounts();
  if (accts.length >= 10) { toast("Maksimum 10 hesap"); return; }
  var exists = accts.some(function(a) { return a.u.toLowerCase() === raw.toLowerCase(); });
  if (exists) { toast("@" + raw + " zaten listede"); return; }
  accts.push({u: raw, lang: lang});
  saveXAccounts(accts);
  inp.value = "";
  renderXDrawer();
  toast("@" + raw + " eklendi");
}

function delXAcct(i) {
  var accts = getXAccounts();
  var removed = accts.splice(i, 1);
  saveXAccounts(accts);
  renderXDrawer();
  if (removed.length) toast("@" + removed[0].u + " silindi");
}

var xLoaded = false;

function loadXFeed(username) {
  var urls = [
    "https://rsshub.app/twitter/user/" + username,
    "https://nitter.net/" + username + "/rss",
    "https://nitter.privacydev.net/" + username + "/rss"
  ];
  return tryXFeed(username, urls, 0);
}

function tryXFeed(username, urls, idx) {
  if (idx >= urls.length) return Promise.resolve([]);
  return fetchOneFeed(urls[idx])
    .then(function(xml) {
      if (!xml || xml.length < 50) throw new Error("empty");
      var items = parseRSS(xml, "@" + username);
      if (!items.length) throw new Error("no items");
      return items;
    })
    .catch(function() { return tryXFeed(username, urls, idx + 1); });
}

function loadXTab() {
  xLoaded = true;
  var accts = getXAccounts();
  if (!accts.length) {
    document.getElementById("l-xt").innerHTML = "<div class=\"empty\">Hesap eklenmedi.<br><span style=\"font-size:11px;color:#333\">Hesaplar butonuna basin.</span></div>";
    return;
  }
  var c = lsGet("xt", 3600000);
  if (c) { renderXNews(c); return; }
  setSpin("xt", true);
  document.getElementById("l-xt").innerHTML = skels(4);
  Promise.all(accts.map(function(a) {
    return loadXFeed(a.u).then(function(items) {
      if (a.lang !== "tr") {
        return Promise.all(items.map(function(item) {
          return translate(item.title).then(function(tr) {
            return {title: tr, summary: item.summary, url: item.url, source: item.source, pub: item.pub};
          });
        }));
      }
      return items;
    });
  })).then(function(results) {
    var all = [];
    results.forEach(function(r) { if (r) all = all.concat(r); });
    all.sort(function(a, b) { return new Date(b.pub) - new Date(a.pub); });
    all = all.slice(0, 20);
    setSpin("xt", false);
    if (all.length) { lsSet("xt", all); renderXNews(all); }
    else {
      var old = lsGetOld("xt");
      if (old && old.v && old.v.length) {
        renderXNews(old.v);
        toast("X: Eski gonderiler gosteriliyor");
      } else {
        document.getElementById("l-xt").innerHTML = "<div class=\"empty\">Twitter yuklenemedi.<br><span style=\"font-size:11px;color:#333\">RSSHub/Nitter erisimi kisitli olabilir.</span></div>";
      }
    }
  });
}

function easterD(y) {
  var a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,
      f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),
      h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,
      l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),
      mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;
  return new Date(y, mo-1, da);
}
function nthSun(y, m, n) {
  var d = new Date(y, m-1, 1), c = 0;
  while (d.getMonth() === m-1) { if (d.getDay() === 0 && ++c === n) return new Date(d); d.setDate(d.getDate()+1); }
  return null;
}

function getEvts(today, y) {
  var ea = easterD(y), md = nthSun(y, 5, 2);
  var dyn = [
    {id:"paskalya", name:"Paskalya",     emoji:"🐣", m:ea.getMonth()+1, d:ea.getDate(), tp:"s", cat:"kutlama", sh:y+" Paskalyasi: "+fmtDM(ea), fl:"Hz. Isa'nin dirilisini kutlayan Hiristiyan bayramidir."},
    {id:"anneler",  name:"Anneler Gunu", emoji:"💐", m:md.getMonth()+1, d:md.getDate(), tp:"s", cat:"kutlama", sh:"Mayis'in ikinci Pazar'i: "+fmtDM(md), fl:"Her yil Mayis'in ikinci Pazar'inda kutlanir."}
  ];
  var all = FE.concat(dyn), res = [];
  var tn = new Date(today.getFullYear(), today.getMonth(), today.getDate());
  for (var i = 0; i < all.length; i++) {
    var ev = all[i], s, e;
    if (ev.tp === "s") {
      var yr = y, t0 = new Date(yr, ev.m-1, ev.d);
      if (t0 < new Date(+tn - 15*864e5)) yr++;
      s = e = new Date(yr, ev.m-1, ev.d);
    } else {
      var sy = y, ey = y;
      if (ev.sM > ev.eM) { if (today.getMonth()+1 <= ev.eM) sy--; else ey++; }
      s = new Date(sy, ev.sM-1, ev.sD);
      e = new Date(ey, ev.eM-1, ev.eD);
    }
    var ds = Math.floor((s - tn) / 864e5), de = Math.floor((e - tn) / 864e5);
    if (ds <= 15 && de >= -15) {
      var st = "up";
      if (ev.tp === "p") { if (ds<=0 && de>=0) st = "act"; else if (de < 0) st = "old"; }
      else { if (ds === 0) st = "act"; else if (ds < 0) st = "old"; }
      res.push({ev:ev, sDate:s, eDate:e, ds:ds, de:de, st:st});
    }
  }
  res.sort(function(a, b) { return a.ds - b.ds; });
  return res;
}

/* ════ RENDER ════ */
function skels(n) {
  var h = ""; n = n || 4;
  for (var i = 0; i < n; i++) {
    h += "<div class=\"sk-wrap\">" +
      "<div class=\"sk\" style=\"height:10px;width:" + (20+i*10) + "%;margin-bottom:8px\"></div>" +
      "<div class=\"sk\" style=\"height:15px;width:96%;margin-bottom:7px\"></div>" +
      "<div class=\"sk\" style=\"height:12px;width:" + (55+i*7) + "%;margin-bottom:6px\"></div>" +
      "<div class=\"sk\" style=\"height:10px;width:25%\"></div></div>";
  }
  return h;
}

function staleNote(t) {
  if (!t) return "";
  return "<p class=\"stale-note\">Son kaydedilen haberler gosteriliyor (" + ago(new Date(t)) + ").</p>";
}

function renderNews(result, lid, cntId, staleId) {
  var el = document.getElementById(lid);
  var cnt = cntId ? document.getElementById(cntId) : null;
  var stEl = staleId ? document.getElementById(staleId) : null;
  var items = result.data || [];
  if (stEl) stEl.innerHTML = result.stale ? staleNote(result.savedAt) : "";
  if (!items.length) {
    el.innerHTML = "<div class=\"empty\">Haber yuklenemedi.<br><span style=\"font-size:11px;color:#2a2a2a\">Yenile'ye basin.</span></div>";
    if (cnt) cnt.style.display = "none";
    return;
  }
  if (cnt) { cnt.textContent = items.length + " haber"; cnt.style.display = "inline"; }
  var h = "";
  for (var i = 0; i < items.length; i++) {
    var it = items[i];
    var lk = (it.url && it.url.indexOf("http") === 0) ?
      "<a class=\"nc-lk\" href=\"" + esc(it.url) + "\" target=\"_blank\" rel=\"noopener\">Habere Git</a>" : "";
    h += "<div class=\"nc\">" +
      "<div class=\"nc-top\"><span class=\"nc-src\">" + esc(it.source) + "</span><span class=\"nc-dt\">" + ago(it.pub) + "</span></div>" +
      "<div class=\"nc-ti\" onclick=\"tSum(this)\">" + esc(it.title) + "</div>" +
      "<div class=\"nc-sm\">" + esc(it.summary || "Haberin tamami icin kaynagi ziyaret edin.") + "</div>" +
      "<div class=\"nc-ac\"><button class=\"btn-oz\" onclick=\"tSum(this.closest(\\'.nc\\').querySelector(\\'.nc-ti\\'))\">Ozet</button>" + lk + "</div>" +
      "</div>";
  }
  el.innerHTML = h;
}

function renderXNews(items) {
  var el = document.getElementById("l-xt");
  if (!items || !items.length) {
    el.innerHTML = "<div class=\"empty\">Gonderi bulunamadi.</div>";
    return;
  }
  var h = "";
  for (var i = 0; i < items.length; i++) {
    var it = items[i];
    var lk = (it.url && it.url.indexOf("http") === 0) ?
      "<a class=\"nc-lk\" href=\"" + esc(it.url) + "\" target=\"_blank\" rel=\"noopener\">Gonderi</a>" : "";
    h += "<div class=\"nc\">" +
      "<div class=\"nc-top\"><span class=\"nc-src x-src\">𝕏 " + esc(it.source) + "</span><span class=\"nc-dt\">" + ago(it.pub) + "</span></div>" +
      "<div class=\"nc-ti\" onclick=\"tSum(this)\">" + esc(it.title) + "</div>" +
      "<div class=\"nc-sm\">" + esc(it.summary || "") + "</div>" +
      "<div class=\"nc-ac\"><button class=\"btn-oz\" onclick=\"tSum(this.closest(\\'.nc\\').querySelector(\\'.nc-ti\\'))\">Ozet</button>" + lk + "</div>" +
      "</div>";
  }
  el.innerHTML = h;
}

function tSum(ti) {
  var nc = ti.closest(".nc"), sm = nc.querySelector(".nc-sm"), btn = nc.querySelector(".btn-oz");
  var o = sm.classList.toggle("on");
  btn.textContent = o ? "Gizle" : "Ozet";
}

function renderHist(evts) {
  var el = document.getElementById("hist-el");
  if (!evts || !evts.length) { el.innerHTML = "<p class=\"empty\">Tarihsel veri yuklenemedi.</p>"; return; }
  var h = "";
  for (var i = 0; i < evts.length; i++) {
    h += "<div class=\"hi\"><span class=\"hi-yr\">" + evts[i].year + "</span><p class=\"hi-tx\">" + esc(evts[i].event) + "</p></div>";
  }
  h += "<p style=\"font-size:10px;color:#2a2a2a;margin-top:10px;font-style:italic\">Kaynak: Vikipedi</p>";
  el.innerHTML = h;
}

function renderFolk() {
  var today = new Date(), y = today.getFullYear();
  var el = document.getElementById("folk-el");
  var evts = getEvts(today, y);
  if (!evts.length) { el.innerHTML = "<p class=\"empty\">Bu donemde yakin takvim olayi yok.</p>"; return; }
  function sc(s) { return s==="act" ? "#c0392b" : s==="up" ? "#e67e22" : "#333"; }
  function sl(ev) {
    if (ev.st === "act") return ev.ev.tp === "p" ? (ev.de===0 ? "Bugün bitiyor" : ev.de+" gun daha") : "Bugun!";
    if (ev.st === "up") return ev.ds + " gun sonra";
    return Math.abs(ev.de) + " gun once bitti";
  }
  var h = "";
  for (var i = 0; i < evts.length; i++) {
    var ev = evts[i], e = ev.ev;
    var dateStr = ev.ev.tp === "p" ? fmtDM(ev.sDate)+" - "+fmtDM(ev.eDate) : fmtDMY(ev.sDate);
    h += "<div class=\"ev" + (ev.st==="act" ? " hot" : "") + "\" id=\"evc-"+e.id+"\">" +
      "<div class=\"ev-hd\" onclick=\"tEv('" + e.id + "')\">" +
        "<span class=\"ev-ic\">" + e.emoji + "</span>" +
        "<div class=\"ev-mt\">" +
          "<strong class=\"ev-nm\">" + esc(e.name) + "</strong>" +
          "<span class=\"ev-dt\">" + dateStr + "</span>" +
          "<span class=\"ev-sh\">" + esc(e.sh) + "</span>" +
        "</div>" +
        "<span class=\"ev-bg\" style=\"background:" + sc(ev.st) + "\">" + sl(ev) + "</span>" +
        "<span class=\"ev-cv\" id=\"ecv-"+e.id+"\">▼</span>" +
      "</div>" +
      "<div class=\"ev-bd\" id=\"evb-"+e.id+"\">" +
        "<p class=\"ev-fl\">" + esc(e.fl) + "</p>" +
        "<span class=\"ev-tg\">#" + e.cat + "</span>" +
      "</div>" +
    "</div>";
  }
  el.innerHTML = h;
}

function tEv(id) {
  var b = document.getElementById("evb-"+id), c = document.getElementById("ecv-"+id);
  var o = b.classList.toggle("on"); c.textContent = o ? "▲" : "▼";
}

/* ════ BİLDİRİMLER ════ */
var notifOn = false;
function toggleNotif() {
  notifOn = !notifOn;
  var btn = document.getElementById("btn-n"), lbl = document.getElementById("n-lbl");
  if (notifOn) {
    btn.classList.add("on"); lbl.textContent = "Aktif ✓";
    toast("Bildirimler acik! Saat basi ekranda bildirim cikar.");
    try {
      if (typeof Notification !== "undefined" && Notification.permission === "default") {
        var p = Notification.requestPermission();
        if (p && typeof p.then === "function") p.then(function(){}).catch(function(){});
      }
    } catch(e) {}
  } else {
    btn.classList.remove("on"); lbl.textContent = "Bildirimler";
    toast("Bildirimler kapatildi.");
  }
}
function notify(msg) {
  if (!notifOn) return;
  toast(msg);
  try { if (typeof Notification !== "undefined" && Notification.permission === "granted") new Notification("Ne Olmus", {body: msg}); } catch(e) {}
}

/* ════ UI ════ */
function setSpin(tab, on) {
  var el = document.getElementById("sp-" + tab);
  if (el) { if (on) el.classList.add("on"); else el.classList.remove("on"); }
}
function setAllSpin(on) {
  ["tr","wo","al","xt"].forEach(function(t) { setSpin(t, on); });
}
function setUpd() {
  document.getElementById("upd-t").textContent =
    new Date().toLocaleTimeString("tr-TR", {hour:"2-digit", minute:"2-digit"});
}
function tick() {
  document.getElementById("clk").textContent =
    new Date().toLocaleTimeString("tr-TR", {hour:"2-digit", minute:"2-digit"});
}
setInterval(tick, 1000); tick();

var aOpen = {h: false, f: false};
function togAcc(k) {
  aOpen[k] = !aOpen[k];
  var b = document.getElementById("body-"+k);
  if (aOpen[k]) b.classList.add("open"); else b.classList.remove("open");
  document.getElementById(k==="h" ? "h-chv" : "f-chv").textContent = aOpen[k] ? "▲" : "▼";
}

function goTab(id, btn) {
  ["tr","wo","al","xt"].forEach(function(t) {
    document.getElementById("p-"+t).style.display = t===id ? "block" : "none";
  });
  document.querySelectorAll(".tab").forEach(function(b) { b.classList.remove("on"); });
  btn.classList.add("on");
  if (id === "xt" && !xLoaded) loadXTab();
}

var tTmr = null;
function toast(msg) {
  var el = document.getElementById("toast");
  el.textContent = msg; el.classList.add("on");
  clearTimeout(tTmr);
  tTmr = setTimeout(function() { el.classList.remove("on"); }, 4000);
}

/* ════ YENİLE ════ */
function doRefresh() {
  toast("Guncelleniyor...");
  ["tr","wo","xt"].forEach(function(k) { lsDel(k); });
  var today = new Date(); lsDel("hist_" + (today.getMonth()+1) + "_" + today.getDate());
  ["l-tr","l-wo","l-al","l-xt"].forEach(function(id) { document.getElementById(id).innerHTML = skels(); });
  ["stale-tr","stale-wo"].forEach(function(id) { document.getElementById(id).innerHTML = ""; });
  document.getElementById("hist-el").innerHTML = skels(3);
  setAllSpin(true);
  xLoaded = false;
  Promise.all([loadTR(), loadWorld(), loadHist()]).then(function(res) {
    var tr = res[0], wo = res[1], hist = res[2];
    renderNews(tr, "l-tr", "cnt-tr", "stale-tr");
    renderNews(wo, "l-wo", "cnt-wo", "stale-wo");
    var all = (tr.data||[]).concat(wo.data||[]).sort(function(a,b){return new Date(b.pub)-new Date(a.pub);}).slice(0,15);
    renderNews({data:all,stale:false}, "l-al", "cnt-al", "");
    var alNote = document.getElementById("al-note");
    if (alNote) alNote.style.display = (wo.data||[]).length > 0 ? "block" : "none";
    renderHist(hist);
    setAllSpin(false);
    setUpd();
    var tl = (tr.data||[]).length, wl = (wo.data||[]).length;
    sbar(tl + " TR + " + wl + " Dunya haberi" + (tr.stale||wo.stale ? " (onceki saatten)" : ""));
    toast(tl+wl > 0 ? tl + " TR + " + wl + " Dunya haberi yuklendi" : "Haber alinamadi. Baglantinizi kontrol edin.");
    notify(tl + " TR + " + wl + " Dunya haberi guncellendi.");
  });
}

        renderNews(t, "l-tr", "cnt-tr", "stale-tr");

        var a = (t.data||[]).concat(w.data||[]).sort(function(a,b){return new Date(b.pub)-new Date(a.pub);}).slice(0,15);
        renderNews({data:a,stale:false}, "l-al", "cnt-al", "");
        setUpd();
        var tl2 = (t.data||[]).length, wl2 = (w.data||[]).length;
        sbar(tl2 + " TR + " + wl2 + " Dunya haberi");
        notify("Saatlik guncelleme: " + tl2 + " TR + " + wl2 + " Dunya haberi.");
        if (document.getElementById("p-xt").style.display !== "none") loadXTab();
      });
    }, 3600000);
  });
})();

})();
