<!DOCTYPE html>

<html lang="tr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="theme-color" content="#0a0a0a"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black"/>
<meta name="apple-mobile-web-app-title" content="Ne Olmuş"/>
<title>Ne Olmuş</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{background:#0a0a0a;color:#e8e4dc;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',sans-serif;min-height:100vh;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{cursor:pointer;border:none;outline:none;background:none}
a{text-decoration:none;-webkit-tap-highlight-color:transparent}

/* HEADER */
#hdr{display:flex;align-items:center;gap:10px;padding:12px 14px 10px;background:#0a0a0a;position:sticky;top:0;z-index:200;border-bottom:1px solid #1a1a1a}
.app-title{font-size:26px;font-weight:800;letter-spacing:-.5px;color:#fff;line-height:1}
.hdr-clock{font-size:11px;color:#555;margin-top:2px}
.hdr-r{display:flex;gap:7px;margin-left:auto;flex-shrink:0}
.pill-btn{display:flex;align-items:center;gap:5px;background:#1c1c1e;color:#e8e4dc;padding:7px 11px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap;border:none}
.pill-btn svg{flex-shrink:0}

/* UPDATE BAR */
#upd-bar{display:flex;align-items:center;padding:5px 14px;font-size:11px;color:#3a3a3a;border-bottom:1px solid #151515;gap:6px}
#upd-time{color:#555;margin-left:auto}

/* ACCORDION */
.acc{border-bottom:1px solid #1a1a1a}
.acc-hd{display:flex;align-items:center;gap:10px;padding:13px 14px;cursor:pointer;user-select:none;-webkit-user-select:none}
.acc-icon{font-size:18px;flex-shrink:0}
.acc-lbl{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#666;flex:1}
.acc-badge{background:#c0392b;color:#fff;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:700}
.acc-chev{color:#444;font-size:12px;flex-shrink:0;transition:transform .25s}
.acc-chev.up{transform:rotate(180deg)}
.acc-body{display:none;padding:0 14px 14px}
.acc-body.open{display:block}

/* TABS */
#tabs{display:flex;padding:0 14px;background:#0a0a0a;border-bottom:1px solid #1a1a1a;position:sticky;top:67px;z-index:100}
.tab{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;padding:12px 4px;background:transparent;border:none;border-bottom:2px solid transparent;color:#555;font-size:13px;font-weight:600;transition:all .15s}
.tab.on{border-bottom-color:#c0392b;color:#fff}
.tab-ico{font-size:15px}

/* MAIN */
#main{padding:0 14px 30px}

/* NEWS SECTION HEADER */
.n-head{display:flex;align-items:center;gap:10px;padding:16px 0 12px;border-bottom:1px solid #1a1a1a;margin-bottom:2px}
.n-title{font-size:22px;font-weight:800;letter-spacing:-.3px;color:#fff}
.load-pill{display:none;align-items:center;gap:4px;background:#1c1c1e;padding:3px 10px;border-radius:12px;font-size:11px;color:#666}
.load-pill.on{display:inline-flex}
.d1{animation:blink 1.2s .0s infinite}
.d2{animation:blink 1.2s .2s infinite}
.d3{animation:blink 1.2s .4s infinite}

/* SKELETON */
.sk-wrap{padding:14px 0;border-bottom:1px solid #131313}
.sk{background:#181818;border-radius:5px;animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:.25}}

/* NEWS CARD */
.nc{padding:13px 0;border-bottom:1px solid #131313;display:flex;gap:10px;align-items:flex-start}
.nc-n{min-width:22px;height:22px;border-radius:4px;background:#c0392b;color:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:900;flex-shrink:0;margin-top:3px}
.nc-b{flex:1;min-width:0}
.nc-top{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.nc-src{font-size:9px;font-weight:700;color:#c0392b;text-transform:uppercase;letter-spacing:.05em}
.nc-dt{font-size:9px;color:#333}
.nc-ti{font-size:14px;font-weight:700;line-height:1.45;color:#e8e4dc;cursor:pointer;margin-bottom:5px}
.nc-sm{font-size:12px;line-height:1.7;color:#666;margin-bottom:7px;display:none}
.nc-sm.on{display:block}
.nc-ac{display:flex;gap:8px;align-items:center}
.btn-oz{background:#1a1a1a;color:#777;padding:4px 10px;border-radius:14px;font-size:11px;font-weight:600;border:none}
.nc-lk{font-size:11px;color:#c0392b;font-weight:600}

/* HISTORY */
.hi{display:flex;gap:14px;padding:10px 0;border-bottom:1px solid #141414}
.hi-yr{min-width:48px;font-size:20px;font-weight:800;color:#c0392b;flex-shrink:0;line-height:1.2}
.hi-tx{font-size:13px;line-height:1.75;color:#b0aca4}
.hi-foot{font-size:10px;color:#2a2a2a;margin-top:10px;font-style:italic}

/* FOLK CALENDAR */
.ev{margin-bottom:8px;border-radius:10px;overflow:hidden;border:1px solid #1c1c1c;background:#111}
.ev.hot{border-color:rgba(192,57,43,.4);background:#120a08}
.ev-hd{display:flex;align-items:center;gap:10px;padding:12px;cursor:pointer;user-select:none;-webkit-user-select:none}
.ev-ic{font-size:22px;min-width:28px}
.ev-mt{flex:1;min-width:0}
.ev-nm{font-size:13px;font-weight:700;display:block;margin-bottom:2px;color:#e8e4dc}
.ev-dt{color:#3a3a3a;font-size:10px;display:block;margin-bottom:1px}
.ev-sh{color:#555;font-size:10px;display:block}
.ev-bg{color:#fff;padding:3px 8px;border-radius:10px;font-size:9px;font-weight:700;white-space:nowrap;flex-shrink:0}
.ev-cv{color:#2e2e2e;font-size:11px;margin-left:4px;flex-shrink:0;transition:transform .2s}
.ev-cv.up{transform:rotate(180deg)}
.ev-bd{display:none;padding:0 12px 12px 52px;border-top:1px solid #181818}
.ev-bd.on{display:block}
.ev-fl{font-size:12px;line-height:1.85;color:#888;margin-top:10px}
.ev-tg{display:inline-block;margin-top:6px;background:#1a1a1a;border-radius:3px;padding:2px 6px;font-size:9px;color:#444}

/* TOAST */
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);z-index:9999;background:#fff;color:#111;padding:10px 20px;border-radius:20px;font-size:13px;font-weight:600;box-shadow:0 4px 24px rgba(0,0,0,.5);display:none;white-space:nowrap;animation:tup .25s ease}
#toast.on{display:block}

/* ERROR */
.err{background:#1a0a0a;border:1px solid #3a1010;border-radius:8px;padding:12px;margin:10px 0;font-size:12px;color:#c06050;line-height:1.6}
.empty{color:#333;font-size:13px;padding:20px 0;text-align:center}

@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
@keyframes tup{from{opacity:0;transform:translateX(-50%) translateY(8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
</style>

</head>

<script>
/* ═══════════════════════════════════════════
   NE OLMUŞ — Tam çalışan sürüm
   RSS: corsproxy.io (birincil) + allorigins (yedek)
   Çeviri: MyMemory (ücretsiz)
   Tarih: Vikipedi API (ücretsiz)
═══════════════════════════════════════════ */

// ── CORS PROXY SEÇENEKLERİ ──────────────────
const PROXIES = [
  u => `https://corsproxy.io/?${encodeURIComponent(u)}`,
  u => `https://api.allorigins.win/get?url=${encodeURIComponent(u)}`,
  u => `https://thingproxy.freeboard.io/fetch/${u}`,
];

// ── RSS KAYNAKLARI ──────────────────────────
const TR_FEEDS = [
  {name:'Hürriyet',   url:'https://www.hurriyet.com.tr/rss/anasayfa'},
  {name:'NTV',        url:'https://www.ntv.com.tr/son-dakika.rss'},
  {name:'Sözcü',      url:'https://www.sozcu.com.tr/rss.xml'},
  {name:'Habertürk',  url:'https://www.haberturk.com/rss'},
];
const WO_FEEDS = [
  {name:'BBC World',  url:'https://feeds.bbci.co.uk/news/world/rss.xml'},
  {name:'Al Jazeera', url:'https://www.aljazeera.com/xml/rss/all.xml'},
  {name:'Sky News',   url:'https://feeds.skynews.com/feeds/rss/world.xml'},
  {name:'Reuters',    url:'https://feeds.reuters.com/reuters/worldNews'},
  {name:'DW',         url:'https://rss.dw.com/xml/rw_en_top'},
];

// ── ÖNBELLEK ───────────────────────────────
function cGet(k,ms=3600000){
  try{const r=JSON.parse(sessionStorage.getItem('no2_'+k));if(r&&Date.now()-r.t<ms)return r.v;}catch{}return null;
}
function cSet(k,v){try{sessionStorage.setItem('no2_'+k,JSON.stringify({v,t:Date.now()}));}catch{}}
function cDel(k){try{sessionStorage.removeItem('no2_'+k);}catch{}}

// ── ARAÇLAR ───────────────────────────────
function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML;}
function strip(h){try{const d=document.createElement('div');d.innerHTML=h||'';return(d.textContent||'').trim();}catch{return '';}}
function fmtDate(d){
  try{
    const dt=d instanceof Date?d:new Date(d);
    if(isNaN(dt))return '';
    return dt.toLocaleDateString('tr-TR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
  }catch{return '';}
}
function fmtDM(d){return d.toLocaleDateString('tr-TR',{day:'numeric',month:'long'});}
function fmtDMY(d){return d.toLocaleDateString('tr-TR',{day:'numeric',month:'long',year:'numeric'});}

// ── RSS ÇEKME ─────────────────────────────
async function fetchXML(url){
  for(const makeProxy of PROXIES){
    try{
      const proxyUrl=makeProxy(url);
      const r=await fetch(proxyUrl,{signal:AbortSignal.timeout(8000)});
      if(!r.ok)continue;
      let text=await r.text();
      // allorigins JSON wrapper
      if(text.trim().startsWith('{')){
        try{const j=JSON.parse(text);text=j.contents||'';}catch{}
      }
      if(text.includes('<item>')||text.includes('<entry>'))return text;
    }catch{}
  }
  return '';
}

function parseRSS(xml,sourceName){
  try{
    const parser=new DOMParser();
    const doc=parser.parseFromString(xml,'text/xml');
    const items=[...doc.querySelectorAll('item,entry')];
    return items.slice(0,3).map(item=>{
      const title=strip(item.querySelector('title')?.textContent||'');
      const link=item.querySelector('link')?.textContent?.trim()||item.querySelector('link')?.getAttribute('href')||'';
      const desc=strip(item.querySelector('description,summary,content')?.textContent||'');
      const pubDate=item.querySelector('pubDate,published,updated')?.textContent||'';
      return{title,summary:desc.slice(0,180),url:link,source:sourceName,pubDate:new Date(pubDate||Date.now())};
    }).filter(i=>i.title&&i.title.length>3);
  }catch{return [];}
}

async function fetchFeed(src){
  const xml=await fetchXML(src.url);
  if(!xml)return[];
  return parseRSS(xml,src.name);
}

// ── TÜRKÇE HABERLERİ YÜKLE ───────────────
async function loadTR(){
  const c=cGet('tr');if(c)return c;
  const results=await Promise.allSettled(TR_FEEDS.map(s=>fetchFeed(s)));
  const all=results.filter(r=>r.status==='fulfilled').flatMap(r=>r.value)
    .filter(i=>i.title).sort((a,b)=>b.pubDate-a.pubDate).slice(0,8);
  if(all.length)cSet('tr',all);
  return all;
}

// ── DÜNYA HABERLERİNİ YÜKLE + ÇEVİR ─────
async function translate(text){
  if(!text||text.length<4)return text;
  const clean=text.slice(0,400);
  const ck='tx_'+clean.slice(0,28).replace(/\W/g,'');
  const hit=cGet(ck,86400000);if(hit)return hit;
  try{
    const r=await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(clean)}&langpair=en|tr`,
      {signal:AbortSignal.timeout(6000)});
    const d=await r.json();
    if(d.responseStatus===200&&d.responseData?.translatedText){
      const res=d.responseData.translatedText;
      cSet(ck,res);return res;
    }
  }catch{}
  return text;
}

async function loadWorld(){
  const c=cGet('wo');if(c)return c;
  const results=await Promise.allSettled(WO_FEEDS.map(s=>fetchFeed(s)));
  const raw=results.filter(r=>r.status==='fulfilled').flatMap(r=>r.value)
    .filter(i=>i.title).sort((a,b)=>b.pubDate-a.pubDate).slice(0,8);
  const translated=await Promise.all(raw.map(async i=>({...i,title:await translate(i.title)})));
  if(translated.length)cSet('wo',translated);
  return translated;
}

// ── TARİHTE BUGÜN (Vikipedi) ─────────────
async function loadHist(){
  const t=new Date();
  const m=t.getMonth()+1,d=t.getDate();
  const ck=`hist_${m}_${d}`;
  const c=cGet(ck,43200000);if(c)return c;

  // TR Vikipedi dene
  try{
    const r=await fetch(`https://tr.wikipedia.org/api/rest_v1/feed/onthisday/events/${m}/${d}`,
      {signal:AbortSignal.timeout(8000)});
    const data=await r.json();
    if(data.events?.length){
      // Yakın tarihten uzağa sırala (yıl azalan)
      const evts=data.events
        .map(e=>({year:e.year,event:e.text}))
        .sort((a,b)=>b.year-a.year)
        .slice(0,10);
      cSet(ck,evts);return evts;
    }
  }catch{}

  // EN Vikipedi + çeviri
  try{
    const r=await fetch(`https://en.wikipedia.org/api/rest_v1/feed/onthisday/events/${m}/${d}`,
      {signal:AbortSignal.timeout(8000)});
    const data=await r.json();
    if(data.events?.length){
      const picked=data.events
        .sort((a,b)=>b.year-a.year)  // yakın tarihten uzağa
        .slice(0,10);
      const evts=await Promise.all(picked.map(async e=>({year:e.year,event:await translate(e.text)})));
      cSet(ck,evts);return evts;
    }
  }catch{}
  return[];
}

// ═══════════════════════════════════════════
// HALK TAKVİMİ
// ═══════════════════════════════════════════
const FE=[
  {id:'zemheri',name:'Zemheri',emoji:'❄️',sM:1,sD:8,eM:2,eD:8,tp:'period',cat:'kış',sh:'Yılın en soğuk 40 günü (8 Ocak – 8 Şubat)',fl:'Zemheri, Anadolu geleneğinde yılın en soğuk kırk günlük dönemidir. Ocak\'ın sekizinden Şubat\'ın sekizine kadar sürer. Dondurucu soğuklar, kar fırtınaları ve tipi hüküm sürer. "Zemheri dondu mu, yılkı yavrusu dondu" sözüyle anlatılır. En soğuk güne "göbek zemheri" denir.'},
  {id:'amansiz',name:'Amansız Elli',emoji:'🥶',sM:12,sD:22,eM:2,eD:10,tp:'period',cat:'kış',sh:'Kışın en sert 50 günü (22 Aralık – 10 Şubat)',fl:'Amansız Elli, kış gündönümünden (22 Aralık) başlayan 50 günlük en sert kış dönemidir. Zemheri\'yi de kapsar; bitiminde baharın müjdecisi Cemreler başlar. "Elli gün kışın amansızı, geçmeden gelmez baharın canı" denir.'},
  {id:'sevgililer',name:'Sevgililer Günü',emoji:'❤️',m:2,d:14,tp:'point',cat:'kutlama',sh:'14 Şubat — Sevgililer Günü',fl:'Her yıl 14 Şubat\'ta kutlanan Sevgililer Günü, sevgi ve aşkın evrensel sembolüdür. Çiçek, çikolata ve sevgi mesajları paylaşılır.'},

function easterDate(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;return new Date(y,mo-1,da);}
function nthSun(y,m,n){let d=new Date(y,m-1,1),c=0;while(d.getMonth()===m-1){if(d.getDay()===0&&++c===n)return new Date(d);d.setDate(d.getDate()+1);}return null;}

function getActiveEvts(today,year){
  const ea=easterDate(year),md=nthSun(year,5,2);
  const dyn=[
    {id:'paskalya',name:'Paskalya',emoji:'🐣',m:ea.getMonth()+1,d:ea.getDate(),tp:'point',cat:'kutlama',sh:year+' Paskalyası: '+fmtDM(ea),fl:'Paskalya, Hz. İsa\'nın dirilişini kutlayan Hristiyan bayramıdır. '+year+'\'da '+fmtDM(ea)+' tarihindedir.'},
    {id:'anneler',name:'Anneler Günü',emoji:'💐',m:md.getMonth()+1,d:md.getDate(),tp:'point',cat:'kutlama',sh:"Mayıs'ın ikinci Pazar'ı: "+fmtDM(md),fl:'Anneler Günü, her yıl Mayıs\'ın ikinci Pazar\'ında kutlanır. '+year+'\'da '+fmtDM(md)+' tarihindedir.'},
  ];
  const all=[...FE,...dyn],res=[];
  const tn=new Date(today.getFullYear(),today.getMonth(),today.getDate());
  for(const ev of all){
    let s,e;
    if(ev.tp==='point'){
      let y=year;
      const t=new Date(y,ev.m-1,ev.d);
      if(t<new Date(tn.getTime()-15*86400000))y++;
      s=e=new Date(y,ev.m-1,ev.d);
    }else{
      let sy=year,ey=year;
      if(ev.sM>ev.eM){if(today.getMonth()+1<=ev.eM)sy--;else ey++;}
      s=new Date(sy,ev.sM-1,ev.sD);e=new Date(ey,ev.eM-1,ev.eD);
    }
    const ds=Math.floor((s-tn)/86400000),de=Math.floor((e-tn)/86400000);
    if(ds<=15&&de>=-15){
      let st='upcoming';
      if(ev.tp==='period'){if(ds<=0&&de>=0)st='active';else if(de<0)st='past';}
      else{if(ds===0)st='active';else if(ds<0)st='past';}
      res.push({...ev,sDate:s,eDate:e,ds,de,st});
    }
  }
  return res.sort((a,b)=>a.ds-b.ds);
}

// ═══════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════

function skeletons(n=4){
  return Array.from({length:n},(_,i)=>`
<div class="sk-wrap">
  <div class="sk" style="height:10px;width:${18+i*8}%;margin-bottom:8px"></div>
  <div class="sk" style="height:14px;width:95%;margin-bottom:6px"></div>
  <div class="sk" style="height:13px;width:${55+i*8}%;margin-bottom:6px"></div>
  <div class="sk" style="height:10px;width:35%"></div>
</div>`).join('');
}

function renderNews(items,lid){
  const el=document.getElementById(lid);
  if(!items||!items.length){
    el.innerHTML=`<div class="empty">Haber yüklenemedi.<br><small style="color:#444">Yenile butonuna basın veya internet bağlantınızı kontrol edin.</small></div>`;
    return;
  }
  el.innerHTML=items.map((it,i)=>`
<div class="nc">
  <div class="nc-n">${i+1}</div>
  <div class="nc-b">
    <div class="nc-top">
      <span class="nc-src">${esc(it.source)}</span>
      <span class="nc-dt">${fmtDate(it.pubDate)}</span>
    </div>
    <div class="nc-ti" onclick="toggleSum(this)">${esc(it.title)||'—'}</div>
    <div class="nc-sm">${esc(it.summary)||''}</div>
    <div class="nc-ac">
      <button class="btn-oz" onclick="toggleSum(this.closest('.nc-b').querySelector('.nc-ti'))">Özet</button>
      ${it.url&&it.url.startsWith('http')?`<a class="nc-lk" href="${esc(it.url)}" target="_blank" rel="noopener">Habere Git →</a>`:''}
    </div>
  </div>
</div>`).join('');
}

function toggleSum(ti){
  const b=ti.closest('.nc-b');
  const sm=b.querySelector('.nc-sm');
  const btn=b.querySelector('.btn-oz');
  const open=sm.classList.toggle('on');
  btn.textContent=open?'Gizle':'Özet';
}

function renderHist(evts){
  const el=document.getElementById('hist-inner');
  if(!evts||!evts.length){el.innerHTML='<p class="empty">Tarihsel veri yüklenemedi.</p>';return;}
  el.innerHTML=evts.map(e=>`
<div class="hi">
  <span class="hi-yr">${e.year}</span>
  <p class="hi-tx">${esc(e.event)}</p>
</div>`).join('')+`<p class="hi-foot">Kaynak: Vikipedi · Yakın tarihten uzağa sıralı</p>`;
}

function renderFolk(){
  const today=new Date(),y=today.getFullYear();
  const el=document.getElementById('folk-inner');
  const evts=getActiveEvts(today,y);
  if(!evts.length){el.innerHTML='<p class="empty">Bu dönemde yakın tarihli takvim olayı yok.</p>';return;}
  const sc=s=>s==='active'?'#c0392b':s==='upcoming'?'#e67e22':'#3a3a3a';
  const sl=ev=>{
    if(ev.st==='active')return ev.tp==='period'?(ev.de===0?'Bugün bitiyor':ev.de+' gün daha'):'📌 Bugün!';
    if(ev.st==='upcoming')return ev.ds+' gün sonra';
    return Math.abs(ev.de)+' gün önce bitti';
  };
  el.innerHTML=evts.map(ev=>`
<div class="ev${ev.st==='active'?' hot':''}" id="evc-${ev.id}">
  <div class="ev-hd" onclick="tEv('${ev.id}')">
    <span class="ev-ic">${ev.emoji}</span>
    <div class="ev-mt">
      <strong class="ev-nm">${esc(ev.name)}</strong>
      <span class="ev-dt">${ev.tp==='period'?fmtDM(ev.sDate)+' – '+fmtDM(ev.eDate):fmtDMY(ev.sDate)}</span>
      <span class="ev-sh">${esc(ev.sh)}</span>
    </div>
    <span class="ev-bg" style="background:${sc(ev.st)}">${sl(ev)}</span>
    <span class="ev-cv" id="ecv-${ev.id}">▼</span>
  </div>
  <div class="ev-bd" id="evb-${ev.id}">
    <p class="ev-fl">${esc(ev.fl)}</p>
    <span class="ev-tg">#${ev.cat}</span>
  </div>
</div>`).join('');
}

function tEv(id){
  const b=document.getElementById('evb-'+id);
  const c=document.getElementById('ecv-'+id);
  const o=b.classList.toggle('on');
  c.textContent=o?'▲':'▼';
  c.classList.toggle('up',o);
}

// ═══════════════════════════════════════════
// BİLDİRİMLER
// ═══════════════════════════════════════════
let notifOK=false;

function reqNotif(){
  const iOS=(/iPad|iPhone|iPod/.test(navigator.userAgent)&&!window.MSStream);
  if(!('Notification' in window)){
    toast('Bu tarayıcı bildirimleri desteklemiyor.');
    return;
  }
  if(iOS&&!window.matchMedia('(display-mode: standalone)').matches){
    toast('iOS\'ta bildirim için önce "Ana Ekrana Ekle" yapın 📲');
    return;
  }
  if(Notification.permission==='granted'){
    notifOK=true;updateNotifUI();
    toast('🔔 Bildirimler zaten aktif!');
    return;
  }
  if(Notification.permission==='denied'){
    toast('Bildirim izni reddedilmiş. Tarayıcı ayarlarından açın.');
    return;
  }
  Notification.requestPermission().then(p=>{
    notifOK=p==='granted';
    updateNotifUI();
    toast(p==='granted'?'🔔 Bildirimler açıldı!':'Bildirim izni verilmedi.');
  });
}

function updateNotifUI(){
  const txt=document.getElementById('notif-txt');
  const btn=document.getElementById('btn-notif');
  if(notifOK){txt.textContent='Bildirim Aktif';btn.style.background='#1a2e1a';}
  else{txt.textContent='Bildirimler';}
}

function sendNotif(title,body){
  if(!notifOK||Notification.permission!=='granted')return;
  try{new Notification(title,{body,icon:'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">📰</text></svg>'});}catch{}
}

// SAAT, AKORDEÓN, TAB, TOAST
// ═══════════════════════════════════════════
function updateClock(){
  const t=new Date();
  document.getElementById('hdr-clock').textContent=t.toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'});
}
setInterval(updateClock,1000);updateClock();

const accOpen={hist:false,folk:false};
function toggleAcc(k){
  accOpen[k]=!accOpen[k];
  document.getElementById('body-'+k).classList.toggle('open',accOpen[k]);
  const ch=document.getElementById('chev-'+k);
  ch.textContent=accOpen[k]?'▲':'▼';
  ch.classList.toggle('up',accOpen[k]);
}

function switchTab(id,btn){
  ['tr','wo','al'].forEach(t=>{document.getElementById('p-'+t).style.display=t===id?'block':'none';});
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
}

let tTimer=null;
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg;el.classList.add('on');
  clearTimeout(tTimer);tTimer=setTimeout(()=>el.classList.remove('on'),3500);
}

// ═══════════════════════════════════════════
// YÜKLEME & YENILEME
// ═══════════════════════════════════════════
let trCache=[],woCache=[];

function setLoading(on){
  ['lp-tr','lp-wo','lp-al'].forEach(id=>{
    document.getElementById(id).classList.toggle('on',on);
  });
}

async function doRefresh(){
  toast('🔄 Güncelleniyor…');
  ['tr','wo'].forEach(k=>cDel(k));
  const today=new Date();
  cDel(`hist_${today.getMonth()+1}_${today.getDate()}`);

  setLoading(true);
  ['l-tr','l-wo','l-al'].forEach(id=>document.getElementById(id).innerHTML=skeletons());
  document.getElementById('hist-inner').innerHTML=skeletons(3);

  const[tr,wo,hist]=await Promise.all([loadTR(),loadWorld(),loadHist()]);
  trCache=tr;woCache=wo;
  setLoading(false);

  renderNews(tr,'l-tr');
  renderNews(wo,'l-wo');
  renderNews([...tr,...wo].sort((a,b)=>b.pubDate-a.pubDate).slice(0,10),'l-al');
  renderHist(hist);

  const now=new Date().toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'});
  document.getElementById('upd-time').textContent=now;
  toast('✅ Güncellendi');
  sendNotif('Ne Olmuş','Haberler güncellendi.');
}

// ═══════════════════════════════════════════
// BAŞLANGIÇ
// ═══════════════════════════════════════════
(async function init(){
  const today=new Date();

  // Tarih rozeti
  document.getElementById('hist-badge').textContent=
    today.toLocaleDateString('tr-TR',{day:'numeric',month:'long'});

  // Takvim (API gerektirmez, anında)
  renderFolk();

  // İskelet göster
  setLoading(true);
  ['l-tr','l-wo','l-al'].forEach(id=>document.getElementById(id).innerHTML=skeletons());

  // Haberleri yükle
  const[tr,wo,hist]=await Promise.all([loadTR(),loadWorld(),loadHist()]);
  trCache=tr;woCache=wo;
  setLoading(false);

  renderNews(tr,'l-tr');
  renderNews(wo,'l-wo');
  renderNews([...tr,...wo].sort((a,b)=>b.pubDate-a.pubDate).slice(0,10),'l-al');
  renderHist(hist);

  const now=new Date().toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'});
  document.getElementById('upd-time').textContent=now;

  // Bildirim durumu
  if(Notification.permission==='granted'){notifOK=true;updateNotifUI();}

  // Saatlik yenileme
  setInterval(async()=>{
    ['tr','wo'].forEach(k=>cDel(k));
    setLoading(true);
    const[t,w]=await Promise.all([loadTR(),loadWorld()]);
    trCache=t;woCache=w;
    setLoading(false);
    renderNews(t,'l-tr');
    renderNews(w,'l-wo');
    renderNews([...t,...w].sort((a,b)=>b.pubDate-a.pubDate).slice(0,10),'l-al');
    document.getElementById('upd-time').textContent=new Date().toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'});
    toast('🔔 Saatlik güncelleme yapıldı');
    sendNotif('Ne Olmuş','Saatlik haber güncellemesi yapıldı.');
  },3600000);
})();
</script>
