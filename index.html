<!DOCTYPE html>

<html lang="tr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="theme-color" content="#0a0a0a"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="Ne Olmuş"/>
<title>Ne Olmuş</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{background:#0a0a0a;color:#e8e4dc;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',sans-serif;min-height:100vh;-webkit-tap-highlight-color:transparent}
button{cursor:pointer;border:none;outline:none;background:none}
a{text-decoration:none;-webkit-tap-highlight-color:transparent}

/* ─── HEADER ─── */
#hdr{display:flex;align-items:center;gap:10px;padding:12px 14px 10px;background:#0a0a0a;position:sticky;top:0;z-index:200;border-bottom:1px solid #1a1a1a}
.logo{flex-shrink:0}
.hdr-mid{flex:1;min-width:0}
.app-title{font-size:26px;font-weight:800;letter-spacing:-.5px;color:#fff;line-height:1}
.clk{font-size:11px;color:#555;margin-top:2px}
.hdr-r{display:flex;gap:7px;flex-shrink:0}
.pill{display:flex;align-items:center;gap:5px;background:#1c1c1e;color:#e8e4dc;padding:7px 11px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap;border:none;transition:background .2s,color .2s}
.pill.on{background:#1a2e1a;color:#5cba5c}

/* ─── UPDATE BAR ─── */
#upd{display:flex;padding:5px 14px;font-size:11px;color:#333;border-bottom:1px solid #141414}
#upd-t{color:#555;margin-left:auto}

/* ─── ACCORDION ─── */
.acc{border-bottom:1px solid #1a1a1a}
.acc-hd{display:flex;align-items:center;gap:10px;padding:13px 14px;cursor:pointer;user-select:none;-webkit-user-select:none}
.acc-ico{font-size:18px;flex-shrink:0}
.acc-lbl{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#666;flex:1}
.acc-bdg{background:#c0392b;color:#fff;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:700}
.acc-chv{color:#444;font-size:12px;flex-shrink:0}
.acc-body{display:none;padding:0 14px 14px}
.acc-body.open{display:block}

/* ─── TABS ─── */
#tabs{display:flex;padding:0 14px;background:#0a0a0a;border-bottom:1px solid #1a1a1a;position:sticky;top:67px;z-index:100}
.tab{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;padding:12px 4px;background:transparent;border:none;border-bottom:2px solid transparent;color:#555;font-size:13px;font-weight:600;transition:color .15s,border-color .15s}
.tab.on{border-bottom-color:#c0392b;color:#fff}

/* ─── MAIN ─── */
#main{padding:0 14px 30px}
.n-head{display:flex;align-items:center;gap:10px;padding:16px 0 12px;border-bottom:1px solid #1a1a1a;margin-bottom:4px}
.n-title{font-size:22px;font-weight:800;color:#fff}
.n-count{background:#222;color:#888;padding:3px 9px;border-radius:12px;font-size:11px;font-weight:600}
.note{font-size:10px;color:#3a5a3a;font-style:italic;margin-bottom:12px}

/* ─── SPINNER ─── */
.spin{width:16px;height:16px;border:2px solid #222;border-top-color:#c0392b;border-radius:50%;animation:spin .8s linear infinite;display:none}
.spin.on{display:block}
@keyframes spin{to{transform:rotate(360deg)}}

/* ─── SKELETON ─── */
.sk-wrap{padding:14px 0;border-bottom:1px solid #111}
.sk{background:#181818;border-radius:5px;animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.6}50%{opacity:.2}}

/* ─── NEWS CARD ─── */
.nc{padding:13px 0;border-bottom:1px solid #131313}
.nc-src-row{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.nc-src{font-size:10px;font-weight:700;color:#fff;background:#c0392b;padding:2px 7px;border-radius:4px;text-transform:uppercase;letter-spacing:.04em}
.nc-dt{font-size:10px;color:#333}
.nc-ti{font-size:15px;font-weight:700;line-height:1.45;color:#e8e4dc;cursor:pointer;margin-bottom:6px}
.nc-sm{font-size:12px;line-height:1.7;color:#666;margin-bottom:8px;display:none}
.nc-sm.on{display:block}
.nc-ac{display:flex;gap:10px;align-items:center}
.btn-oz{background:#1a1a1a;color:#777;padding:5px 12px;border-radius:14px;font-size:11px;font-weight:600;border:none;cursor:pointer}
.nc-lk{font-size:11px;color:#c0392b;font-weight:600;display:flex;align-items:center;gap:3px}

/* ─── HISTORY ─── */
.hi{display:flex;gap:14px;padding:10px 0;border-bottom:1px solid #141414}
.hi-yr{min-width:48px;font-size:20px;font-weight:800;color:#c0392b;flex-shrink:0;line-height:1.2}
.hi-tx{font-size:13px;line-height:1.75;color:#b0aca4}

/* ─── FOLK CALENDAR ─── */
.ev{margin-bottom:8px;border-radius:10px;overflow:hidden;border:1px solid #1c1c1c;background:#111}
.ev.hot{border-color:rgba(192,57,43,.4);background:#120a08}
.ev-hd{display:flex;align-items:center;gap:10px;padding:12px;cursor:pointer;user-select:none;-webkit-user-select:none}
.ev-ic{font-size:22px;min-width:28px}
.ev-mt{flex:1;min-width:0}
.ev-nm{font-size:13px;font-weight:700;display:block;margin-bottom:2px;color:#e8e4dc}
.ev-dt{color:#3a3a3a;font-size:10px;display:block;margin-bottom:1px}
.ev-sh{color:#555;font-size:10px;display:block}
.ev-bg{color:#fff;padding:3px 8px;border-radius:10px;font-size:9px;font-weight:700;white-space:nowrap;flex-shrink:0}
.ev-cv{color:#2e2e2e;font-size:11px;margin-left:4px;flex-shrink:0}
.ev-bd{display:none;padding:0 12px 12px 52px;border-top:1px solid #181818}
.ev-bd.on{display:block}
.ev-fl{font-size:12px;line-height:1.85;color:#888;margin-top:10px}
.ev-tg{display:inline-block;margin-top:6px;background:#1a1a1a;border-radius:3px;padding:2px 6px;font-size:9px;color:#444}

/* ─── TOAST ─── */
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);z-index:9999;
background:#fff;color:#111;padding:10px 20px;border-radius:20px;
font-size:13px;font-weight:600;box-shadow:0 4px 24px rgba(0,0,0,.6);
display:none;max-width:90vw;text-align:center}
#toast.on{display:block;animation:tup .25s ease}
@keyframes tup{from{opacity:0;transform:translateX(-50%) translateY(8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

/* ─── STATUS ─── */
#sbar{font-size:10px;color:#2a2a2a;padding:3px 14px 2px;min-height:18px}

.empty{color:#444;font-size:13px;padding:24px 0;text-align:center;line-height:1.9}
</style>

</head>

<script>
/* ════════════════════════════════════════════════════
   Ne Olmuş — v6  (Güvenilir sürüm)

   RSS → rss2json.com/v1/api.json (JSON çıktısı, parse yok)
   Çeviri → MyMemory API (ücretsiz)
   Tarih → Wikipedia TR/EN
   Bildirim → in-app toast (iOS uyumlu) + native (desteklenen cihazlarda)
════════════════════════════════════════════════════ */

/* ── KAYNAKLAR (tam olarak belirtildiği gibi) ── */
var TR_FEEDS = [
  {n:'Hürriyet',   u:'https://www.hurriyet.com.tr/rss/anasayfa'},
  {n:'NTV',        u:'https://www.ntv.com.tr/son-dakika.rss'},
  {n:'Sözcü',      u:'https://www.sozcu.com.tr/rss.xml'},
  {n:'Habertürk',  u:'https://www.haberturk.com/rss'}
];
var WO_FEEDS = [
  {n:'BBC World',         u:'https://feeds.bbci.co.uk/news/world/rss.xml'},
  {n:'NY Times',          u:'https://rss.nytimes.com/services/xml/rss/nyt/World.xml'},
  {n:'Sky News',          u:'https://feeds.skynews.com/feeds/rss/world.xml'},
  {n:'Al Jazeera',        u:'https://www.aljazeera.com/xml/rss/all.xml'},
  {n:'CNN International', u:'https://rss.cnn.com/rss/edition_world.rss'}
];

/* ── ÖNBELLEK (sessionStorage) ── */
var CACHE = {
  get: function(k, maxMs) {
    try {
      var raw = sessionStorage.getItem('no6_' + k);
      if (!raw) return null;
      var obj = JSON.parse(raw);
      if (Date.now() - obj.t < (maxMs || 3600000)) return obj.v;
    } catch(e) {}
    return null;
  },
  set: function(k, v) {
    try { sessionStorage.setItem('no6_' + k, JSON.stringify({v:v, t:Date.now()})); } catch(e) {}
  },
  del: function(k) {
    try { sessionStorage.removeItem('no6_' + k); } catch(e) {}
  }
};

/* ── iOS uyumlu timeout (AbortController) ── */
function timedFetch(url, ms) {
  var ctrl = new AbortController();
  var tid = setTimeout(function() { ctrl.abort(); }, ms || 12000);
  return fetch(url, {signal: ctrl.signal}).then(function(r) {
    clearTimeout(tid);
    return r;
  }).catch(function(e) {
    clearTimeout(tid);
    throw e;
  });
}

/* ── ARAÇLAR ── */
function esc(s) {
  var d = document.createElement('div');
  d.textContent = String(s || '');
  return d.innerHTML;
}

function stripHtml(s) {
  if (!s) return '';
  var d = document.createElement('div');
  d.innerHTML = s;
  return (d.textContent || d.innerText || '').replace(/\s+/g, ' ').trim();
}

function fmtAgo(dateStr) {
  try {
    var d = new Date(dateStr);
    if (isNaN(d.getTime())) return '';
    var diff = Math.floor((Date.now() - d.getTime()) / 60000);
    if (diff < 1) return 'Az önce';
    if (diff < 60) return diff + ' dk önce';
    if (diff < 1440) return Math.floor(diff/60) + ' sa önce';
    return d.toLocaleDateString('tr-TR', {day:'numeric', month:'short'});
  } catch(e) { return ''; }
}

function fmtDM(d) { return d.toLocaleDateString('tr-TR',{day:'numeric',month:'long'}); }
function fmtDMY(d) { return d.toLocaleDateString('tr-TR',{day:'numeric',month:'long',year:'numeric'}); }

function sbar(msg) { document.getElementById('sbar').textContent = msg; }

/* ── RSS2JSON API ── */
// rss2json.com → RSS/Atom'u JSON'a çevirir, CORS sorunu yok
// Ücretsiz plan: 1000 istek/gün, saniyede 1 istek
// Dönen format: { status:"ok", feed:{...}, items:[{title, link, pubDate, description, ...}] }
function fetchRss2Json(feedUrl, count) {
  var apiUrl = 'https://api.rss2json.com/v1/api.json?rss_url=' +
    encodeURIComponent(feedUrl) + '&count=' + (count || 4) + '&api_key=';
  return timedFetch(apiUrl, 12000)
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data.status !== 'ok' || !data.items) return [];
      return data.items;
    })
    .catch(function() { return []; });
}

function rssItemToNews(item, sourceName) {
  var title = stripHtml(item.title || '');
  if (!title || title.length < 4) return null;
  var summary = stripHtml(item.description || item.content || '').slice(0, 200);
  var url = item.link || item.guid || '';
  var pubDate = item.pubDate ? new Date(item.pubDate) : new Date();
  if (isNaN(pubDate.getTime())) pubDate = new Date();
  return {title:title, summary:summary, url:url, source:sourceName, pubDate:pubDate};
}

/* ── TÜRK HABERLERİ ── */
function loadTR() {
  return new Promise(function(resolve) {
    var c = CACHE.get('tr_v6');
    if (c) { resolve(c); return; }

    spin(true, 'tr');
    sbar('Türkiye haberleri yükleniyor…');

    var promises = TR_FEEDS.map(function(f) {
      return fetchRss2Json(f.u, 4).then(function(items) {
        return items.map(function(i) { return rssItemToNews(i, f.n); }).filter(Boolean);
      });
    });

    Promise.all(promises).then(function(results) {
      var all = [];
      results.forEach(function(r) { all = all.concat(r); });
      all.sort(function(a,b) { return b.pubDate - a.pubDate; });
      all = all.slice(0, 10);
      spin(false, 'tr');
      if (all.length) CACHE.set('tr_v6', all);
      resolve(all);
    });
  });
}

/* ── ÇEVİRİ (MyMemory) ── */
function translate(text) {
  return new Promise(function(resolve) {
    if (!text || text.length < 4) { resolve(text); return; }
    var clean = text.slice(0, 400);
    var ck = 'tx6_' + encodeURIComponent(clean.slice(0,18)).replace(/%/g,'X');
    var hit = CACHE.get(ck, 86400000);
    if (hit) { resolve(hit); return; }

    var url = 'https://api.mymemory.translated.net/get?q=' +
              encodeURIComponent(clean) + '&langpair=en|tr';
    timedFetch(url, 8000)
      .then(function(r) { return r.json(); })
      .then(function(d) {
        if (d.responseStatus === 200 && d.responseData && d.responseData.translatedText) {
          var res = d.responseData.translatedText;
          CACHE.set(ck, res);
          resolve(res);
        } else { resolve(text); }
      })
      .catch(function() { resolve(text); });
  });
}

/* ── DÜNYA HABERLERİ ── */
function loadWorld() {
  return new Promise(function(resolve) {
    var c = CACHE.get('wo_v6');
    if (c) { resolve(c); return; }

    spin(true, 'wo');
    sbar('Dünya haberleri yükleniyor…');

    var promises = WO_FEEDS.map(function(f) {
      return fetchRss2Json(f.u, 3).then(function(items) {
        return items.map(function(i) { return rssItemToNews(i, f.n); }).filter(Boolean);
      });
    });

    Promise.all(promises).then(function(results) {
      var all = [];
      results.forEach(function(r) { all = all.concat(r); });
      all.sort(function(a,b) { return b.pubDate - a.pubDate; });
      all = all.slice(0, 10);

      // Başlıkları Türkçe'ye çevir
      var trPromises = all.map(function(item) {
        return translate(item.title).then(function(trTitle) {
          return Object.assign({}, item, {title: trTitle, origTitle: item.title});
        });
      });

      Promise.all(trPromises).then(function(translated) {
        spin(false, 'wo');
        if (translated.length) CACHE.set('wo_v6', translated);
        resolve(translated);
      });
    });
  });
}

/* ── TARİHTE BUGÜN ── */
function loadHist() {
  return new Promise(function(resolve) {
    var today = new Date();
    var m = today.getMonth() + 1, d = today.getDate();
    var ck = 'hist6_' + m + '_' + d;
    var c = CACHE.get(ck, 43200000);
    if (c) { resolve(c); return; }

    timedFetch('https://tr.wikipedia.org/api/rest_v1/feed/onthisday/events/' + m + '/' + d, 10000)
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if (!data.events || !data.events.length) { resolve([]); return; }
        var evts = data.events
          .map(function(e) { return {year: parseInt(e.year)||0, event: e.text}; })
          .filter(function(e) { return e.year > 0 && e.event; })
          .sort(function(a,b) { return b.year - a.year; })
          .slice(0, 12);
        CACHE.set(ck, evts);
        resolve(evts);
      })
      .catch(function() {
        // EN Wikipedia fallback
        timedFetch('https://en.wikipedia.org/api/rest_v1/feed/onthisday/events/' + m + '/' + d, 10000)
          .then(function(r) { return r.json(); })
          .then(function(data) {
            if (!data.events || !data.events.length) { resolve([]); return; }
            var picked = data.events
              .map(function(e) { return {year: parseInt(e.year)||0, event: e.text}; })
              .filter(function(e) { return e.year > 0; })
              .sort(function(a,b) { return b.year - a.year; })
              .slice(0, 12);
            var trP = picked.map(function(e) {
              return translate(e.event).then(function(tr) { return {year:e.year, event:tr}; });
            });
            Promise.all(trP).then(function(evts) {
              CACHE.set(ck, evts);
              resolve(evts);
            });
          })
          .catch(function() { resolve([]); });
      });
  });
}

/* ══════════ HALK TAKVİMİ ══════════ */
var FE = [
  {id:'zemheri',   name:'Zemheri',               emoji:'❄️',  sM:1, sD:8,  eM:2, eD:8,  tp:'p',cat:'kış',     sh:'Yılın en soğuk 40 günü (8 Oca–8 Şub)',  fl:'Zemheri, Anadolu geleneğinde yılın en soğuk kırk günlük dönemidir. Ocak 8\'den Şubat 8\'e kadar sürer. En soğuk güne "göbek zemheri" denir.'},
  {id:'amansiz',   name:'Amansız Elli',           emoji:'🥶',  sM:12,sD:22, eM:2, eD:10, tp:'p',cat:'kış',     sh:'Kışın en sert 50 günü (22 Ara–10 Şub)', fl:'Kış gündönümünden başlayan 50 günlük en sert kış dönemidir. Zemheri\'yi kapsar; bitiminde Cemreler başlar.'},
  {id:'sevgililer',name:'Sevgililer Günü',         emoji:'❤️',  m:2,  d:14,              tp:'s',cat:'kutlama',  sh:'14 Şubat',                               fl:'Sevgi ve aşkın evrensel sembolüdür.'},

function easterD(y){var a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;return new Date(y,mo-1,da);}
function nthSun(y,m,n){var d=new Date(y,m-1,1),c=0;while(d.getMonth()===m-1){if(d.getDay()===0&&++c===n)return new Date(d);d.setDate(d.getDate()+1);}return null;}

function getEvts(today, y) {
  var ea = easterD(y), md = nthSun(y,5,2);
  var dyn = [
    {id:'paskalya',name:'Paskalya',emoji:'🐣',m:ea.getMonth()+1,d:ea.getDate(),tp:'s',cat:'kutlama',sh:y+' Paskalyası: '+fmtDM(ea),fl:'Hz. İsa\'nın dirilişini kutlayan Hristiyan bayramıdır.'},
    {id:'anneler', name:'Anneler Günü',emoji:'💐',m:md.getMonth()+1,d:md.getDate(),tp:'s',cat:'kutlama',sh:"Mayıs'ın ikinci Pazar'ı: "+fmtDM(md),fl:'Her yıl Mayıs\'ın ikinci Pazar\'ında kutlanır.'}
  ];
  var all = FE.concat(dyn), res = [];
  var tn = new Date(today.getFullYear(), today.getMonth(), today.getDate());
  for (var i=0; i<all.length; i++) {
    var ev = all[i], s, e;
    if (ev.tp === 's') {
      var yr = y, t0 = new Date(yr, ev.m-1, ev.d);
      if (t0 < new Date(+tn - 15*864e5)) yr++;
      s = e = new Date(yr, ev.m-1, ev.d);
    } else {
      var sy=y, ey=y;
      if (ev.sM > ev.eM) { if(today.getMonth()+1 <= ev.eM) sy--; else ey++; }
      s = new Date(sy, ev.sM-1, ev.sD);
      e = new Date(ey, ev.eM-1, ev.eD);
    }
    var ds = Math.floor((s-tn)/864e5), de = Math.floor((e-tn)/864e5);
    if (ds<=15 && de>=-15) {
      var st = 'up';
      if (ev.tp==='p') { if(ds<=0&&de>=0) st='act'; else if(de<0) st='old'; }
      else { if(ds===0) st='act'; else if(ds<0) st='old'; }
      res.push({ev:ev, sDate:s, eDate:e, ds:ds, de:de, st:st});
    }
  }
  res.sort(function(a,b){return a.ds-b.ds;});
  return res;
}

/* ══════════ RENDER ══════════ */
function skels(n) {
  var html='', k=n||4;
  for(var i=0;i<k;i++){
    html += '<div class="sk-wrap">' +
      '<div class="sk" style="height:10px;width:'+(20+i*10)+'%;margin-bottom:8px"></div>' +
      '<div class="sk" style="height:16px;width:96%;margin-bottom:7px"></div>' +
      '<div class="sk" style="height:12px;width:'+(55+i*7)+'%;margin-bottom:6px"></div>' +
      '<div class="sk" style="height:10px;width:25%"></div>' +
      '</div>';
  }
  return html;
}

function renderNews(items, lid, cntId) {
  var el = document.getElementById(lid);
  var cnt = document.getElementById(cntId);
  if (!items || !items.length) {
    el.innerHTML = '<div class="empty">Haber yüklenemedi.<br>' +
      '<span style="font-size:11px;color:#2a2a2a">Yenile\'ye basın.</span></div>';
    if(cnt) cnt.style.display='none';
    return;
  }
  if(cnt){ cnt.textContent = items.length + ' haber'; cnt.style.display='inline'; }
  var html = '';
  for (var i=0; i<items.length; i++) {
    var it = items[i];
    var lkHtml = (it.url && it.url.indexOf('http')===0) ?
      '<a class="nc-lk" href="'+esc(it.url)+'" target="_blank" rel="noopener">🔗 Habere Git</a>' : '';
    html += '<div class="nc">' +
      '<div class="nc-src-row">' +
        '<span class="nc-src">'+esc(it.source)+'</span>' +
        '<span class="nc-dt">'+fmtAgo(it.pubDate)+'</span>' +
      '</div>' +
      '<div class="nc-ti" onclick="tSum(this)">'+esc(it.title||'—')+'</div>' +
      '<div class="nc-sm">'+esc(it.summary||'Haberin tamamı için kaynağı ziyaret edin.')+'</div>' +
      '<div class="nc-ac">' +
        '<button class="btn-oz" onclick="tSum(this.closest(\'.nc\').querySelector(\'.nc-ti\'))">Özet</button>' +
        lkHtml +
      '</div>' +
    '</div>';
  }
  el.innerHTML = html;
}

function tSum(ti) {
  var nc = ti.closest('.nc');
  var sm = nc.querySelector('.nc-sm');
  var btn = nc.querySelector('.btn-oz');
  var o = sm.classList.toggle('on');
  btn.textContent = o ? 'Gizle' : 'Özet';
}

function renderHist(evts) {
  var el = document.getElementById('hist-el');
  if (!evts || !evts.length) { el.innerHTML='<p class="empty">Tarihsel veri yüklenemedi.</p>'; return; }
  var html='';
  for(var i=0;i<evts.length;i++){
    html += '<div class="hi"><span class="hi-yr">'+evts[i].year+'</span><p class="hi-tx">'+esc(evts[i].event)+'</p></div>';
  }
  html += '<p style="font-size:10px;color:#2a2a2a;margin-top:10px;font-style:italic">Kaynak: Vikipedi · Yakın tarihten uzağa</p>';
  el.innerHTML = html;
}

function renderFolk() {
  var today=new Date(), y=today.getFullYear();
  var el=document.getElementById('folk-el');
  var evts=getEvts(today,y);
  if(!evts.length){el.innerHTML='<p class="empty">Bu dönemde yakın tarihli takvim olayı yok.</p>';return;}

  function sc(s){return s==='act'?'#c0392b':s==='up'?'#e67e22':'#333';}
  function sl(item){
    if(item.st==='act') return item.ev.tp==='p'?(item.de===0?'Bugün bitiyor':item.de+' gün daha'):'📌 Bugün!';
    if(item.st==='up') return item.ds+' gün sonra';
    return Math.abs(item.de)+' gün önce bitti';
  }

  var html='';
  for(var i=0;i<evts.length;i++){
    var ev=evts[i], e=ev.ev;
    var dateStr=ev.ev.tp==='p'?fmtDM(ev.sDate)+' – '+fmtDM(ev.eDate):fmtDMY(ev.sDate);
    html += '<div class="ev'+(ev.st==='act'?' hot':'')+'" id="evc-'+e.id+'">' +
      '<div class="ev-hd" onclick="tEv(\''+e.id+'\')">' +
        '<span class="ev-ic">'+e.emoji+'</span>' +
        '<div class="ev-mt">' +
          '<strong class="ev-nm">'+esc(e.name)+'</strong>' +
          '<span class="ev-dt">'+dateStr+'</span>' +
          '<span class="ev-sh">'+esc(e.sh)+'</span>' +
        '</div>' +
        '<span class="ev-bg" style="background:'+sc(ev.st)+'">'+sl(ev)+'</span>' +
        '<span class="ev-cv" id="ecv-'+e.id+'">▼</span>' +
      '</div>' +
      '<div class="ev-bd" id="evb-'+e.id+'">' +
        '<p class="ev-fl">'+esc(e.fl)+'</p>' +
        '<span class="ev-tg">#'+e.cat+'</span>' +
      '</div>' +
    '</div>';
  }
  el.innerHTML = html;
}

function tEv(id){
  var b=document.getElementById('evb-'+id),c=document.getElementById('ecv-'+id);
  var o=b.classList.toggle('on'); c.textContent=o?'▲':'▼';
}

/* ══════════ BİLDİRİMLER ══════════
   iOS Safari: Notification API yok → sadece in-app toast
   Android Chrome / Desktop: gerçek bildirim denenebilir
   Buton her zaman çalışır: açık/kapalı toggle
*/
var notifOn = false;

function toggleNotif() {
  notifOn = !notifOn;
  var btn = document.getElementById('btn-n');
  var lbl = document.getElementById('n-lbl');
  if (notifOn) {
    btn.classList.add('on');
    lbl.textContent = 'Aktif ✓';
    toast('🔔 Bildirimler açık! Saat başı ekranda bildirim çıkar.');
    /* Notification.requestPermission() bazı iOS sürümlerinde
       undefined döner (Promise değil) → .catch patlar.
       Bu yüzden try/catch içine alıyoruz. */
    try {
      if (typeof Notification !== 'undefined' && Notification.permission === 'default') {
        var p = Notification.requestPermission();
        if (p && typeof p.then === 'function') {
          p.then(function(){}).catch(function(){});
        }
      }
    } catch(e) { /* sessizce geç */ }
  } else {
    btn.classList.remove('on');
    lbl.textContent = 'Bildirimler';
    toast('🔕 Bildirimler kapatıldı.');
  }
}

function notify(msg) {
  if (!notifOn) return;
  toast('🔔 ' + msg);
  // Native bildirim mümkünse dene
  if (typeof Notification !== 'undefined' && Notification.permission === 'granted') {
    try { new Notification('Ne Olmuş', {body:msg}); } catch(e){}
  }
}

/* ══════════ UI ARAÇLARI ══════════ */
function spin(on, tab) {
  var ids = tab ? ['sp-'+tab] : ['sp-tr','sp-wo','sp-al'];
  ids.forEach(function(id) {
    var el = document.getElementById(id);
    if (!el) return;
    if (on) { el.classList.add('on'); } else { el.classList.remove('on'); }
  });
}

function setUpd() {
  document.getElementById('upd-t').textContent =
    new Date().toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'});
}

/* Saat */
function tick() {
  document.getElementById('clk').textContent =
    new Date().toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'});
}
setInterval(tick, 1000); tick();

/* Akordeon */
var aOpen = {h:false, f:false};
function togAcc(k) {
  aOpen[k] = !aOpen[k];
  var body = document.getElementById('body-'+k);
  /* classList.toggle 2. argümanı eski iOS'ta çalışmaz → açık add/remove */
  if (aOpen[k]) {
    body.classList.add('open');
  } else {
    body.classList.remove('open');
  }
  var chvId = k==='h' ? 'h-chv' : 'f-chv';
  document.getElementById(chvId).textContent = aOpen[k] ? '▲' : '▼';
}

/* Sekmeler */
function goTab(id, btn) {
  ['tr','wo','al'].forEach(function(t){
    document.getElementById('p-'+t).style.display = (t===id)?'block':'none';
  });
  document.querySelectorAll('.tab').forEach(function(b){ b.classList.remove('on'); });
  btn.classList.add('on');
}

/* Toast */
var _tTmr = null;
function toast(msg) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('on');
  clearTimeout(_tTmr);
  _tTmr = setTimeout(function(){ el.classList.remove('on'); }, 4000);
}

/* ══════════ YENİLE ══════════ */
function doRefresh() {
  toast('🔄 Güncelleniyor…');
  CACHE.del('tr_v6'); CACHE.del('wo_v6');
  var today=new Date();
  CACHE.del('hist6_'+(today.getMonth()+1)+'_'+today.getDate());

  document.getElementById('l-tr').innerHTML=skels();
  document.getElementById('l-wo').innerHTML=skels();
  document.getElementById('l-al').innerHTML=skels();
  document.getElementById('hist-el').innerHTML=skels(3);

  spin(true, 'tr'); spin(true, 'wo'); spin(true, 'al');

  Promise.all([loadTR(), loadWorld(), loadHist()]).then(function(res) {
    var tr=res[0], wo=res[1], hist=res[2];
    renderNews(tr,'l-tr','cnt-tr');
    renderNews(wo,'l-wo','cnt-wo');
    var all=tr.concat(wo).sort(function(a,b){return b.pubDate-a.pubDate;}).slice(0,15);
    renderNews(all,'l-al','cnt-al');
    renderHist(hist);
    spin(false,'tr'); spin(false,'wo'); spin(false,'al');
    setUpd();
    var msg = tr.length+' TR + '+wo.length+' Dünya haberi yüklendi';
    sbar(msg);
    toast('✅ '+msg);
    notify('Haberler güncellendi.');
  });
}

/* ══════════ BAŞLANGIÇ ══════════ */

  var today = new Date();
  document.getElementById('h-bdg').textContent =

  renderFolk();  // API gerektirmez

  aOpen.h = true;

  document.getElementById('l-tr').innerHTML=skels();
  document.getElementById('l-wo').innerHTML=skels();
  document.getElementById('l-al').innerHTML=skels();
  spin(true,'tr'); spin(true,'wo'); spin(true,'al');

  sbar('Yükleniyor…');

  Promise.all([loadTR(), loadWorld(), loadHist()]).then(function(res) {
    var tr=res[0], wo=res[1], hist=res[2];
    renderNews(tr,'l-tr','cnt-tr');
    renderNews(wo,'l-wo','cnt-wo');
    var all=tr.concat(wo).sort(function(a,b){return b.pubDate-a.pubDate;}).slice(0,15);
    renderNews(all,'l-al','cnt-al');
    renderHist(hist);
    spin(false,'tr'); spin(false,'wo'); spin(false,'al');
    setUpd();
    sbar(tr.length+' TR + '+wo.length+' Dünya haberi');

    // Saatlik yenileme
    setInterval(function(){
      CACHE.del('tr_v6'); CACHE.del('wo_v6');
      Promise.all([loadTR(), loadWorld()]).then(function(res2){
        var t=res2[0], w=res2[1];
        renderNews(t,'l-tr','cnt-tr');
        renderNews(w,'l-wo','cnt-wo');
        var a=t.concat(w).sort(function(a,b){return b.pubDate-a.pubDate;}).slice(0,15);
        renderNews(a,'l-al','cnt-al');
        setUpd();
        notify('Saatlik güncelleme: '+t.length+' TR + '+w.length+' Dünya haberi.');
        sbar(t.length+' TR + '+w.length+' Dünya haberi');
      });
    }, 3600000);
  });
})();
