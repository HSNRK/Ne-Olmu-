<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{background:#0a0a0a;color:#e8e4dc;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',sans-serif;min-height:100vh;-webkit-tap-highlight-color:transparent}
button{cursor:pointer;border:none;outline:none;background:none}

/* ─── HEADER ─── */
#hdr{display:flex;align-items:center;gap:10px;padding:12px 14px 10px;background:#0a0a0a;position:sticky;top:0;z-index:200;border-bottom:1px solid #1a1a1a}

.hdr-r{display:flex;gap:7px;margin-left:auto;flex-shrink:0}
.pill{display:flex;align-items:center;gap:5px;background:#1c1c1e;color:#e8e4dc;padding:7px 11px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap;border:none}

/* ─── UPDATE BAR ─── */

/* ─── TABS ─── */

/* ─── TOAST ─── */
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);z-index:9999;
background:#fff;color:#111;padding:10px 20px;border-radius:20px;
font-size:13px;font-weight:600;box-shadow:0 4px 24px rgba(0,0,0,.6);
display:none;white-space:nowrap;animation:tup .25s ease}

/* ─── STATUS ─── */

<script>
/* ════════════════════════════════════════════
   Ne Olmuş — v4  (Nisan 2025)
   RSS: allorigins /raw  +  corsproxy.io  +  codetabs
   Çeviri: MyMemory (ücretsiz)
   Tarih: Wikipedia TR/EN
════════════════════════════════════════════ */

// ── KAYNAKLAR ──────────────────────────────
const TR = [
  {n:'Hürriyet',  u:'https://www.hurriyet.com.tr/rss/anasayfa'},
  {n:'NTV',       u:'https://www.ntv.com.tr/son-dakika.rss'},
  {n:'Sözcü',     u:'https://www.sozcu.com.tr/rss.xml'},
  {n:'Habertürk', u:'https://www.haberturk.com/rss'},
];
const WO = [
  {n:'BBC World',  u:'https://feeds.bbci.co.uk/news/world/rss.xml'},
  {n:'Al Jazeera', u:'https://www.aljazeera.com/xml/rss/all.xml'},
  {n:'DW',         u:'https://rss.dw.com/xml/rw_en_top'},
  {n:'Reuters',    u:'https://feeds.reuters.com/reuters/worldNews'},
  {n:'Sky News',   u:'https://feeds.skynews.com/feeds/rss/world.xml'},
];

// ── ÖNBELLEK ───────────────────────────────
const C = {
  get(k, ms=3600000){
    try{const r=JSON.parse(sessionStorage.getItem('no4_'+k));if(r&&Date.now()-r.t<ms)return r.v;}catch{}return null;
  },
  set(k,v){try{sessionStorage.setItem('no4_'+k,JSON.stringify({v,t:Date.now()}));}catch{}},
  del(k){try{sessionStorage.removeItem('no4_'+k);}catch{}}
};

// ── ARAÇLAR ────────────────────────────────
const esc = s => {
  const d=document.createElement('div');
  d.textContent=String(s||'');
  return d.innerHTML;
};

// CDATA'yı düz metne çevir + HTML strip
function cleanText(raw){
  if(!raw) return '';
  // CDATA unwrap
  let s = raw.replace(/<!\[CDATA\[([\s\S]*?)\]\]>/g, '$1');
  // HTML tags kaldır
  s = s.replace(/<[^>]+>/g,' ');
  // Entities decode
  const tmp=document.createElement('textarea');
  tmp.innerHTML=s;
  s=tmp.value;
  return s.replace(/\s+/g,' ').trim();
}

function fmtDate(d){
  try{
    const dt = (d instanceof Date) ? d : new Date(d);
    if(isNaN(dt.getTime())) return '';
    return dt.toLocaleDateString('tr-TR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
  }catch{return '';}
}
const fmtDM  = d => d.toLocaleDateString('tr-TR',{day:'numeric',month:'long'});
const fmtDMY = d => d.toLocaleDateString('tr-TR',{day:'numeric',month:'long',year:'numeric'});

// ── RSS ÇEKME ──────────────────────────────
// allorigins /raw → doğrudan XML metni döner (JSON wrapper yok)
// corsproxy.io   → doğrudan içerik döner
// codetabs       → doğrudan içerik döner

async function fetchRaw(url){
  const proxies = [
    `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
    `https://corsproxy.io/?${encodeURIComponent(url)}`,
    `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`,
  ];

  for(const p of proxies){
    try{
      const r = await fetch(p, {signal: AbortSignal.timeout(9000)});
      if(!r.ok) continue;
      const text = await r.text();
      // Geçerli RSS/Atom mı?
      if(text && text.length > 200 && (text.includes('<item') || text.includes('<entry'))){
        return text;
      }
    }catch(e){
      // bir sonraki proxy'e geç
    }
  }
  return '';
}

function parseRSS(xml, name){
  try{
    const doc = new DOMParser().parseFromString(xml,'text/xml');
    if(doc.querySelector('parsererror')){
      // XML hatalı ise text/html ile tekrar parse et
      const doc2 = new DOMParser().parseFromString(xml,'text/html');
      return parseItems(doc2, name);
    }
    return parseItems(doc, name);
  }catch{return [];}
}

function parseItems(doc, name){
  const items = [...doc.querySelectorAll('item,entry')];
  return items.slice(0,3).map(item => {
    // Başlık
    const titleEl = item.querySelector('title');
    const title = cleanText(titleEl?.textContent || '');

    // Link
    let url = '';
    const linkEl = item.querySelector('link');
    if(linkEl){
      url = linkEl.getAttribute('href') || cleanText(linkEl.textContent) || '';
    }
    // Atom <link rel="alternate">
    if(!url){
      const alt = item.querySelector('link[rel="alternate"]');
      url = alt?.getAttribute('href') || '';
    }

    // Özet
    const descEl = item.querySelector(
      'description, summary, [type="html"], content'
    );
    const summary = cleanText(descEl?.textContent || '').slice(0, 200);

    // Tarih
    const dateEl = item.querySelector('pubDate, published, updated, dc\\:date');
    const pubDate = new Date(dateEl?.textContent || Date.now());

    return {title, summary, url, source: name, pubDate};
  }).filter(i => i.title && i.title.length > 4);
}

async function fetchFeed(src){
  const xml = await fetchRaw(src.u);
  if(!xml) return [];
  return parseRSS(xml, src.n);
}

// ── TÜRK HABERLERİ ─────────────────────────
async function loadTR(){
  const c = C.get('tr'); if(c) return c;
  setSpinner(['sp-tr','sp-al'], true);
  const res = await Promise.allSettled(TR.map(s => fetchFeed(s)));
  const all = res
    .filter(r => r.status==='fulfilled')
    .flatMap(r => r.value)
    .filter(i => i.title)
    .sort((a,b) => b.pubDate - a.pubDate)
    .slice(0,8);
  setSpinner(['sp-tr','sp-al'], false);
  if(all.length) C.set('tr', all);
  return all;
}

// ── DÜNYA HABERLERİ ────────────────────────
async function translate(text){
  if(!text || text.length < 4) return text;
  const clean = text.slice(0, 400);
  const ck = 'tx_' + clean.slice(0,20).replace(/\W/g,'');
  const hit = C.get(ck, 86400000); if(hit) return hit;
  try{
    const r = await fetch(
      `https://api.mymemory.translated.net/get?q=${encodeURIComponent(clean)}&langpair=en|tr`,
      {signal: AbortSignal.timeout(7000)}
    );
    const d = await r.json();
    if(d.responseStatus===200 && d.responseData?.translatedText){
      const res = d.responseData.translatedText;
      C.set(ck, res);
      return res;
    }
  }catch{}
  return text;
}

async function loadWorld(){
  const c = C.get('wo'); if(c) return c;
  setSpinner(['sp-wo','sp-al'], true);
  const res = await Promise.allSettled(WO.map(s => fetchFeed(s)));
  const raw = res
    .filter(r => r.status==='fulfilled')
    .flatMap(r => r.value)
    .filter(i => i.title)
    .sort((a,b) => b.pubDate - a.pubDate)
    .slice(0,8);
  const translated = await Promise.all(
    raw.map(async i => ({...i, title: await translate(i.title)}))
  );
  setSpinner(['sp-wo','sp-al'], false);
  if(translated.length) C.set('wo', translated);
  return translated;
}

// ── TARİHTE BUGÜN ──────────────────────────
async function loadHist(){
  const t = new Date(), m = t.getMonth()+1, d = t.getDate();
  const ck = `hist_${m}_${d}`;
  const c = C.get(ck, 43200000); if(c) return c;

  // Türkçe Wikipedia
  try{
    const r = await fetch(
      `https://tr.wikipedia.org/api/rest_v1/feed/onthisday/events/${m}/${d}`,
      {signal: AbortSignal.timeout(8000)}
    );
    const data = await r.json();
    if(data.events?.length){
      const evts = data.events
        .map(e => ({year: parseInt(e.year)||0, event: e.text}))
        .filter(e => e.year>0 && e.event)
        .sort((a,b) => b.year - a.year)  // yakın tarihten uzağa
        .slice(0,12);
      C.set(ck, evts);
      return evts;
    }
  }catch{}

  // İngilizce Wikipedia + çeviri
  try{
    const r = await fetch(
      `https://en.wikipedia.org/api/rest_v1/feed/onthisday/events/${m}/${d}`,
      {signal: AbortSignal.timeout(8000)}
    );
    const data = await r.json();
    if(data.events?.length){
      const picked = data.events
        .map(e => ({year: parseInt(e.year)||0, event: e.text}))
        .filter(e => e.year>0)
        .sort((a,b) => b.year - a.year)
        .slice(0,12);
      const evts = await Promise.all(
        picked.map(async e => ({year: e.year, event: await translate(e.event)}))
      );
      C.set(ck, evts);
      return evts;
    }
  }catch{}
  return [];
}

// ═══════════════ HALK TAKVİMİ ═════════════
const FE=[
  {id:'zemheri',  name:'Zemheri',            emoji:'❄️',  sM:1,  sD:8,  eM:2, eD:8,  tp:'p',cat:'kış',   sh:'Yılın en soğuk 40 günü (8 Oca–8 Şub)',   fl:'Zemheri, Anadolu geleneğinde yılın en soğuk kırk günlük dönemidir. Ocak 8\'den Şubat 8\'e kadar sürer. En soğuk güne "göbek zemheri" denir.'},
  {id:'amansiz',  name:'Amansız Elli',        emoji:'🥶',  sM:12, sD:22, eM:2, eD:10, tp:'p',cat:'kış',   sh:'Kışın en sert 50 günü (22 Ara–10 Şub)',   fl:'Kış gündönümünden başlayan 50 günlük en sert kış dönemidir. Zemheri\'yi kapsar; bitiminde Cemreler başlar.'},
  {id:'sevgililer',name:'Sevgililer Günü',     emoji:'❤️',  m:2,   d:14,  tp:'s',cat:'kutlama',sh:'14 Şubat',fl:'Sevgi ve aşkın evrensel sembolüdür.'},
  {id:'bede',     name:'Bede Yeli (Vade Yeli)',emoji:'💨',  sM:2,  sD:19, eM:2, eD:21, tp:'p',cat:'hava',  sh:'Şubat sonu sert rüzgar (19–21 Şub)',      fl:'"Bede yeli eser, kışın borcunu öder."'},
  {id:'cemre1',   name:'1. Cemre — Havaya',   emoji:'🔥',  m:2,   d:19,  tp:'s',cat:'doğa',  sh:'Hava ısınır (19–20 Şub)',                 fl:'Cemre, baharın gelişini müjdeleyen sembolik ateş parçasıdır. Birinci cemre havaya düşer.'},
  {id:'cemre2',   name:'2. Cemre — Suya',     emoji:'💧',  m:2,   d:26,  tp:'s',cat:'doğa',  sh:'Sular ısınır (26–27 Şub)',                fl:'İkinci cemre suya düşer. Pınar ve akarsuların ısınmaya başladığına inanılır.'},

function easterD(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;return new Date(y,mo-1,da);}
function nthSun(y,m,n){let d=new Date(y,m-1,1),c=0;while(d.getMonth()===m-1){if(d.getDay()===0&&++c===n)return new Date(d);d.setDate(d.getDate()+1);}return null;}

function getEvts(today,y){
  const ea=easterD(y), md=nthSun(y,5,2);
  const dyn=[
    {id:'paskalya',name:'Paskalya',emoji:'🐣',m:ea.getMonth()+1,d:ea.getDate(),tp:'s',cat:'kutlama',sh:y+' Paskalyası: '+fmtDM(ea),fl:'Hz. İsa\'nın dirilişini kutlayan Hristiyan bayramıdır.'},
    {id:'anneler', name:'Anneler Günü',emoji:'💐',m:md.getMonth()+1,d:md.getDate(),tp:'s',cat:'kutlama',sh:"Mayıs'ın ikinci Pazar'ı: "+fmtDM(md),fl:'Her yıl Mayıs\'ın ikinci Pazar\'ında kutlanır.'},
  ];
  const all=[...FE,...dyn], res=[];
  const tn=new Date(today.getFullYear(),today.getMonth(),today.getDate());
  for(const ev of all){
    let s,e;
    if(ev.tp==='s'){let yr=y;const t=new Date(yr,ev.m-1,ev.d);if(t<new Date(+tn-15*864e5))yr++;s=e=new Date(yr,ev.m-1,ev.d);}
    else{let sy=y,ey=y;if(ev.sM>ev.eM){if(today.getMonth()+1<=ev.eM)sy--;else ey++;}s=new Date(sy,ev.sM-1,ev.sD);e=new Date(ey,ev.eM-1,ev.eD);}
    const ds=Math.floor((s-tn)/864e5), de=Math.floor((e-tn)/864e5);
    if(ds<=15&&de>=-15){
      let st='up';
      if(ev.tp==='p'){if(ds<=0&&de>=0)st='act';else if(de<0)st='old';}
      else{if(ds===0)st='act';else if(ds<0)st='old';}
      res.push({...ev,sDate:s,eDate:e,ds,de,st});
    }
  }
  return res.sort((a,b)=>a.ds-b.ds);
}

// ═══════════════ RENDER ═══════════════════

function skels(n=4){
  return Array.from({length:n},(_,i)=>`
<div class="sk-wrap">
  <div class="sk" style="height:10px;width:${22+i*9}%;margin-bottom:8px"></div>
  <div class="sk" style="height:15px;width:95%;margin-bottom:7px"></div>
  <div class="sk" style="height:12px;width:${55+i*8}%;margin-bottom:6px"></div>
  <div class="sk" style="height:10px;width:28%"></div>
</div>`).join('');
}

function renderNews(items, lid){
  const el = document.getElementById(lid);
  if(!items || !items.length){
    el.innerHTML = `<div class="empty">
      Haber yüklenemedi.<br>
      <span style="font-size:11px;color:#333">
        Yenile butonuna basın.<br>
        İnternet bağlantınız varsa birkaç saniye içinde gelir.
      </span>
    </div>`;
    return;
  }
  el.innerHTML = items.map((it,i)=>`
<div class="nc">
  <div class="nc-n">${i+1}</div>
  <div class="nc-b">
    <div class="nc-top">
      <span class="nc-src">${esc(it.source)}</span>
      <span class="nc-dt">${fmtDate(it.pubDate)}</span>
    </div>
    <div class="nc-ti" onclick="tSum(this)">${esc(it.title)||'—'}</div>
    <div class="nc-sm">${esc(it.summary)||'Özet mevcut değil.'}</div>
    <div class="nc-ac">
      <button class="btn-oz" onclick="tSum(this.closest('.nc-b').querySelector('.nc-ti'))">Özet</button>
      ${it.url && it.url.startsWith('http') ? `<a class="nc-lk" href="${esc(it.url)}" target="_blank" rel="noopener">Habere Git →</a>` : ''}
    </div>
  </div>
</div>`).join('');
}

function tSum(ti){
  const b=ti.closest('.nc-b'), sm=b.querySelector('.nc-sm'), btn=b.querySelector('.btn-oz');
  const o = sm.classList.toggle('on');
  btn.textContent = o ? 'Gizle' : 'Özet';
}

function renderHist(evts){
  const el = document.getElementById('hist');
  if(!evts || !evts.length){
    el.innerHTML = '<p class="empty">Tarihsel veri yüklenemedi.</p>';
    return;
  }
  el.innerHTML = evts.map(e=>`
<div class="hi">
  <span class="hi-yr">${e.year}</span>
  <p class="hi-tx">${esc(e.event)}</p>
</div>`).join('') + `<p style="font-size:10px;color:#2a2a2a;margin-top:10px;font-style:italic">Kaynak: Vikipedi · Yakın tarihten uzağa</p>`;
}

function renderFolk(){
  const today=new Date(), y=today.getFullYear();
  const el=document.getElementById('folk');
  const evts=getEvts(today,y);
  if(!evts.length){el.innerHTML='<p class="empty">Bu dönemde yakın tarihli takvim olayı yok.</p>';return;}
  const sc=s=>s==='act'?'#c0392b':s==='up'?'#e67e22':'#333';
  const sl=ev=>{
    if(ev.st==='act')return ev.tp==='p'?(ev.de===0?'Bugün bitiyor':ev.de+' gün daha'):'📌 Bugün!';
    if(ev.st==='up')return ev.ds+' gün sonra';
    return Math.abs(ev.de)+' gün önce bitti';
  };
  el.innerHTML=evts.map(ev=>`
<div class="ev${ev.st==='act'?' hot':''}" id="evc-${ev.id}">
  <div class="ev-hd" onclick="tEv('${ev.id}')">
    <span class="ev-ic">${ev.emoji}</span>
    <div class="ev-mt">
      <strong class="ev-nm">${esc(ev.name)}</strong>
      <span class="ev-dt">${ev.tp==='p'?fmtDM(ev.sDate)+' – '+fmtDM(ev.eDate):fmtDMY(ev.sDate)}</span>
      <span class="ev-sh">${esc(ev.sh)}</span>
    </div>
    <span class="ev-bg" style="background:${sc(ev.st)}">${sl(ev)}</span>
    <span class="ev-cv" id="ecv-${ev.id}">▼</span>
  </div>
  <div class="ev-bd" id="evb-${ev.id}">
    <p class="ev-fl">${esc(ev.fl)}</p>
    <span class="ev-tg">#${ev.cat}</span>
  </div>
</div>`).join('');
}

function tEv(id){
  const b=document.getElementById('evb-'+id), c=document.getElementById('ecv-'+id);
  const o=b.classList.toggle('on'); c.textContent=o?'▲':'▼';
}

// ═══════════════ BİLDİRİMLER ══════════════
// iOS Safari Notification API'yi DESTEKLEMEZ.
// Bu yüzden: uygulama içi bildirim (toast) kullanıyoruz.
// Android Chrome'da gerçek bildirim de denenecek.

let notifOn = false;

function toggleNotif(){
  notifOn = !notifOn;
  const btn = document.getElementById('btn-n');
  const lbl = document.getElementById('n-lbl');
  if(notifOn){
    btn.classList.add('on');
    lbl.textContent = 'Aktif ✓';
    toast('🔔 Bildirimler açık! Saat başı güncelleme bildirimi alırsınız.');

    // Android/Desktop Chrome'da gerçek bildirim dene
    if('Notification' in window && Notification.permission === 'default'){
      Notification.requestPermission().catch(()=>{});
    }
  } else {
    btn.classList.remove('on');
    lbl.textContent = 'Bildirimler';
    toast('🔕 Bildirimler kapatıldı.');
  }
}

function notify(msg){
  // Uygulama içi toast her zaman
  if(notifOn) toast('🔔 ' + msg);

  // Gerçek bildirim mümkünse dene
  if(notifOn && 'Notification' in window && Notification.permission==='granted'){
    try{ new Notification('Ne Olmuş', {body: msg}); }catch{}
  }
}

// ═══════════════ UI YARDIMCILARI ══════════
function setSpinner(ids, on){
  ids.forEach(id => {
    const el = document.getElementById(id);
    if(el) el.classList.toggle('on', on);
  });
}

function setStatus(msg){
  document.getElementById('status-bar').textContent = msg;
}

// ═══════════════ SAAT ══════════════════════
function tick(){
  document.getElementById('clk').textContent =
    new Date().toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'});
}
setInterval(tick, 1000); tick();

// ═══════════════ AKORDEÓN ══════════════════
const aOpen={h:false,f:false};
function togAcc(k){
  aOpen[k]=!aOpen[k];
  document.getElementById('body-'+k).classList.toggle('open',aOpen[k]);
  const chvId = k==='h' ? 'h-chv' : 'f-chv';
  document.getElementById(chvId).textContent = aOpen[k]?'▲':'▼';
}

// ═══════════════ SEKMELER ══════════════════
function goTab(id,btn){
  ['tr','wo','al'].forEach(t=>document.getElementById('p-'+t).style.display=t===id?'block':'none');
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
}

// ═══════════════ TOAST ═════════════════════
let tTmr=null;
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('on');
  clearTimeout(tTmr);
  tTmr=setTimeout(()=>el.classList.remove('on'),4000);
}

// ═══════════════ YENİLE ════════════════════
async function doRefresh(){
  toast('🔄 Güncelleniyor…');
  C.del('tr'); C.del('wo');
  const t=new Date(); C.del(`hist_${t.getMonth()+1}_${t.getDate()}`);

  ['l-tr','l-wo','l-al'].forEach(id=>document.getElementById(id).innerHTML=skels());
  document.getElementById('hist').innerHTML = skels(3);

  const[tr,wo,hist] = await Promise.all([loadTR(), loadWorld(), loadHist()]);

  renderNews(tr, 'l-tr');
  renderNews(wo, 'l-wo');
  const all = [...tr,...wo].sort((a,b)=>b.pubDate-a.pubDate).slice(0,12);
  renderNews(all, 'l-al');
  renderHist(hist);

  const now = new Date().toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'});
  document.getElementById('upd-t').textContent = now;

  const msg = `${tr.length} Türkiye + ${wo.length} Dünya haberi yüklendi`;
  setStatus(msg);
  toast('✅ ' + msg);
  notify('Haberler güncellendi.');
}

// ═══════════════ BAŞLANGIÇ ═════════════════
(async ()=>{
  const today = new Date();

  // Tarih rozeti
  document.getElementById('h-bdg').textContent =
    today.toLocaleDateString('tr-TR',{day:'numeric',month:'long'});

  // Takvim (API gerektirmez)
  renderFolk();

  // Skeleton
  ['l-tr','l-wo','l-al'].forEach(id=>document.getElementById(id).innerHTML=skels());
  setSpinner(['sp-tr','sp-wo','sp-al'],true);

  // Paralel yükle
  setStatus('Yükleniyor…');
  const[tr,wo,hist] = await Promise.all([loadTR(), loadWorld(), loadHist()]);
  setSpinner(['sp-tr','sp-wo','sp-al'],false);

  renderNews(tr,'l-tr');
  renderNews(wo,'l-wo');
  const all=[...tr,...wo].sort((a,b)=>b.pubDate-a.pubDate).slice(0,12);
  renderNews(all,'l-al');
  renderHist(hist);

  const now=new Date().toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'});
  document.getElementById('upd-t').textContent=now;

  const msg=`${tr.length} TR + ${wo.length} Dünya haberi`;
  setStatus(msg);

  // Saatlik yenileme
  setInterval(async()=>{
    C.del('tr'); C.del('wo');
    const[t,w]=await Promise.all([loadTR(),loadWorld()]);
    renderNews(t,'l-tr');
    renderNews(w,'l-wo');
    const a=[...t,...w].sort((a,b)=>b.pubDate-a.pubDate).slice(0,12);
    renderNews(a,'l-al');
    document.getElementById('upd-t').textContent=
      new Date().toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'});
    notify('Saatlik güncelleme yapıldı. '+t.length+' TR + '+w.length+' Dünya haberi.');
  },3600000);
})();
</script>
