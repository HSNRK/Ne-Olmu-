<!DOCTYPE html>

<html lang="tr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<meta name="theme-color" content="#0a0a0a"/>
<title>Ne Olmuş</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{background:#0a0a0a;color:#e8e4dc;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',sans-serif;min-height:100vh;-webkit-tap-highlight-color:transparent}
button{cursor:pointer;border:none;outline:none;-webkit-tap-highlight-color:transparent}
a{text-decoration:none;-webkit-tap-highlight-color:transparent}

/* ── HEADER ── */
#hdr{
display:flex;align-items:center;gap:10px;
padding:12px 14px 10px;
background:#0a0a0a;
position:sticky;top:0;z-index:200;
}
.logo-wrap svg{display:block;flex-shrink:0}
.title-block{flex:1;min-width:0}
.app-title{font-size:28px;font-weight:800;letter-spacing:-.5px;line-height:1;color:#fff}
.hdr-time{font-size:11px;color:#555;margin-top:2px}
.hdr-btns{display:flex;gap:7px;flex-shrink:0}
.btn-notif{
display:flex;align-items:center;gap:5px;
background:#1c1c1e;border:none;color:#e8e4dc;
padding:7px 11px;border-radius:20px;font-size:11px;font-weight:600;
white-space:nowrap;
}
.btn-notif svg{flex-shrink:0}
.btn-refresh{
display:flex;align-items:center;gap:5px;
background:#1c1c1e;border:none;color:#e8e4dc;
padding:7px 11px;border-radius:20px;font-size:11px;font-weight:600;
white-space:nowrap;
}

/* ── GÜNCELLEME ÇUBUĞU ── */
#upd-bar{
display:flex;align-items:center;gap:6px;
padding:6px 14px;
border-bottom:1px solid #1a1a1a;
font-size:11px;color:#444;
}
#upd-bar span{flex:1}
#upd-time{color:#666;font-size:11px}

/* ── AKORDEON BÖLÜMLER (Tarihte Bugün + Maarif Takvimi) ── */
.accordion{border-bottom:1px solid #1a1a1a}
.acc-head{
display:flex;align-items:center;gap:10px;
padding:13px 14px;cursor:pointer;
user-select:none;-webkit-user-select:none;
}
.acc-icon{font-size:18px;flex-shrink:0}
.acc-label{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#888;flex:1}
.acc-badge{background:#c0392b;color:#fff;padding:3px 9px;border-radius:12px;font-size:11px;font-weight:700;margin-right:4px}
.acc-chev{color:#444;font-size:14px;transition:transform .2s;flex-shrink:0}
.acc-chev.open{transform:rotate(180deg)}
.acc-body{display:none;padding:0 14px 14px}
.acc-body.open{display:block}

/* ── TABS ── */
#tabs{
display:flex;
padding:0 14px;
border-bottom:1px solid #1a1a1a;
background:#0a0a0a;
position:sticky;top:68px;z-index:100;
gap:0;
}
.tab{
flex:1;display:flex;align-items:center;justify-content:center;gap:6px;
padding:12px 4px;background:transparent;border:none;
border-bottom:2px solid transparent;
color:#555;font-size:13px;font-weight:600;
transition:all .15s;
}
.tab.active{border-bottom-color:#c0392b;color:#fff}
.tab-emoji{font-size:16px}

/* ── MAIN ── */
#main{padding:0 14px 20px}

/* ── SECTION HEADER ── */
.news-head{
display:flex;align-items:center;gap:10px;
padding:16px 0 12px;
border-bottom:1px solid #1a1a1a;
margin-bottom:4px;
}
.news-head-title{font-size:22px;font-weight:800;letter-spacing:-.3px}
.loading-pill{
background:#222;color:#666;
padding:3px 10px;border-radius:12px;font-size:11px;font-weight:600;
display:inline-flex;align-items:center;gap:4px;
}
.loading-pill .dot{animation:blink 1.2s infinite;font-size:8px}
.loading-pill .dot:nth-child(2){animation-delay:.2s}
.loading-pill .dot:nth-child(3){animation-delay:.4s}

/* ── SKELETON ── */
.sk{padding:14px 0;border-bottom:1px solid #131313}
.sk-line{background:#1a1a1a;border-radius:4px;margin-bottom:7px;animation:shimmer 1.4s infinite}
.sk-line:last-child{margin-bottom:0}
@keyframes shimmer{0%,100%{opacity:.5}50%{opacity:.25}}

/* ── HABER KARTI ── */
.nc{padding:14px 0;border-bottom:1px solid #131313;display:flex;gap:10px;align-items:flex-start}
.nc-num{
min-width:22px;height:22px;border-radius:4px;
background:#c0392b;color:#fff;
display:flex;align-items:center;justify-content:center;
font-size:11px;font-weight:900;flex-shrink:0;margin-top:2px;
}
.nc-body{flex:1;min-width:0}
.nc-src-row{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.nc-src{font-size:10px;font-weight:700;color:#c0392b;text-transform:uppercase;letter-spacing:.04em}
.nc-date{font-size:10px;color:#333}
.nc-title{font-size:15px;font-weight:700;line-height:1.45;color:#e8e4dc;cursor:pointer;margin-bottom:5px}
.nc-sum{font-size:12px;line-height:1.7;color:#777;margin-bottom:8px;display:none}
.nc-sum.open{display:block}
.nc-actions{display:flex;gap:8px;align-items:center}
.btn-ozet{background:#1a1a1a;border:none;color:#777;padding:4px 10px;border-radius:14px;font-size:11px;font-weight:600}
.nc-link{font-size:11px;color:#c0392b;font-weight:600}

/* ── TARİHTE BUGÜN ── */
.hist-item{display:flex;gap:14px;padding:10px 0;border-bottom:1px solid #141414}
.hist-year{min-width:50px;font-size:20px;font-weight:800;color:#c0392b;flex-shrink:0;line-height:1.2}
.hist-text{font-size:13px;line-height:1.75;color:#b8b4ac}
.hist-src{font-size:10px;color:#333;margin-top:12px;font-style:italic}

/* ── MAARİF TAKVİMİ ── */
.ev{margin-bottom:8px;border-radius:10px;overflow:hidden;border:1px solid #1c1c1c;background:#111}
.ev.act{border-color:rgba(192,57,43,.4);background:#120808}
.ev-hd{display:flex;align-items:center;gap:10px;padding:12px 12px;cursor:pointer;user-select:none;-webkit-user-select:none}
.ev-ico{font-size:22px;min-width:28px}
.ev-mt{flex:1;min-width:0}
.ev-nm{font-size:13px;font-weight:700;display:block;margin-bottom:2px;color:#e8e4dc}
.ev-dt{color:#444;font-size:10px;display:block;margin-bottom:1px}
.ev-sh{color:#555;font-size:10px;display:block}
.ev-bg{color:#fff;padding:3px 8px;border-radius:10px;font-size:9px;font-weight:700;white-space:nowrap;flex-shrink:0}
.ev-ch{color:#333;font-size:11px;margin-left:4px;flex-shrink:0;transition:transform .2s}
.ev-ch.open{transform:rotate(180deg)}
.ev-bd{display:none;padding:0 12px 12px 50px;border-top:1px solid #181818}
.ev-bd.open{display:block}
.ev-fl{font-size:12px;line-height:1.85;color:#888;margin-top:10px}
.ev-tg{display:inline-block;margin-top:6px;background:#1a1a1a;border-radius:3px;padding:2px 6px;font-size:9px;color:#444}

/* ── TOAST ── */
#toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:9999;
background:#1c1c1e;color:#fff;padding:10px 18px;border-radius:20px;
font-size:13px;font-weight:600;box-shadow:0 8px 30px rgba(0,0,0,.8);
display:none;white-space:nowrap;animation:tIn .25s ease}
#toast.show{display:block}

/* ── EMPTY / ERR ── */
.empty{color:#333;font-size:12px;padding:16px 0;text-align:center}

@keyframes tIn{from{opacity:0;transform:translateX(-50%) translateY(-8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
</style>

</head>
<body>

    <rect x="35" y="9"  width="9" height="24" fill="#0a0a0a"/>
    <rect x="56" y="9"  width="9" height="24" fill="#0a0a0a"/>
    <rect x="35" y="18" width="30" height="5"  fill="white"/>
    <rect x="35" y="68" width="9" height="24" fill="#0a0a0a"/>

<div id="main">

  <!-- TR -->

  <div id="panel-tr">

<script>
'use strict';

// ═══════════════ ÜCRETSİZ API'ler ═══════════════
// RSS   → api.rss2json.com  (ücretsiz)
// Çeviri → api.mymemory.translated.net (ücretsiz)
// Tarih → tr.wikipedia.org  (ücretsiz)

const R2J='https://api.rss2json.com/v1/api.json';
const TR_SRC=[
  {name:'Hürriyet',  url:'https://www.hurriyet.com.tr/rss/anasayfa'},
  {name:'NTV',       url:'https://www.ntv.com.tr/son-dakika.rss'},
  {name:'Sözcü',     url:'https://www.sozcu.com.tr/rss.xml'},
  {name:'Habertürk', url:'https://www.haberturk.com/rss'},
];
const WO_SRC=[
  {name:'BBC World', url:'https://feeds.bbci.co.uk/news/world/rss.xml'},
  {name:'NY Times',  url:'https://rss.nytimes.com/services/xml/rss/nyt/World.xml'},
  {name:'Al Jazeera',url:'https://www.aljazeera.com/xml/rss/all.xml'},
  {name:'CNN',       url:'https://rss.cnn.com/rss/edition_world.rss'},
  {name:'Sky News',  url:'https://feeds.skynews.com/feeds/rss/world.xml'},
];

// ── Önbellek ──
function cSet(k,v){try{sessionStorage.setItem('no_'+k,JSON.stringify({v,t:Date.now()}));}catch{}}
function cGet(k,ms=3600000){try{const r=JSON.parse(sessionStorage.getItem('no_'+k));if(r&&Date.now()-r.t<ms)return r.v;}catch{}return null;}

// ── Araçlar ──
function strip(h){try{const d=document.createElement('div');d.innerHTML=h;return(d.textContent||d.innerText||'').trim();}catch{return '';}}
function fmtDate(d){try{return new Date(d).toLocaleDateString('tr-TR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});}catch{return '';}}
function fmtDM(d){return d.toLocaleDateString('tr-TR',{day:'numeric',month:'long'});}
function fmtDMY(d){return d.toLocaleDateString('tr-TR',{day:'numeric',month:'long',year:'numeric'});}

// ── RSS ──
async function fetchRSS(url,n=3){
  try{
    const r=await fetch(`${R2J}?rss_url=${encodeURIComponent(url)}&count=${n}&api_key=`,{signal:AbortSignal.timeout(8000)});
    const d=await r.json();
    return d.status==='ok'?(d.items||[]):[];
  }catch{return [];}
}

// ── Çeviri (MyMemory) ──
async function translate(text){
  if(!text||text.length<4)return text;
  const clean=text.slice(0,400);
  const ck='tx_'+clean.slice(0,30).replace(/\W/g,'_');
  const hit=cGet(ck,86400000);if(hit)return hit;
  try{
    const r=await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(clean)}&langpair=en|tr`,{signal:AbortSignal.timeout(6000)});
    const d=await r.json();
    if(d.responseStatus===200&&d.responseData?.translatedText){
      cSet(ck,d.responseData.translatedText);
      return d.responseData.translatedText;
    }
  }catch{}
  return text;
}

// ── Türkiye haberleri ──
async function loadTR(){
  const c=cGet('tr_news');if(c)return c;
  const res=await Promise.allSettled(TR_SRC.map(async s=>{
    const items=await fetchRSS(s.url,2);
    return items.map(i=>({title:strip(i.title||''),summary:strip(i.description||'').slice(0,180),source:s.name,url:i.link||'',pubDate:new Date(i.pubDate||0)}));
  }));
  const all=res.filter(r=>r.status==='fulfilled').flatMap(r=>r.value).filter(i=>i.title).sort((a,b)=>b.pubDate-a.pubDate).slice(0,7);
  cSet('tr_news',all);return all;
}

// ── Dünya haberleri ──
async function loadWorld(){
  const c=cGet('wo_news');if(c)return c;
  const res=await Promise.allSettled(WO_SRC.map(async s=>{
    const items=await fetchRSS(s.url,2);
    return items.map(i=>({title:strip(i.title||''),summary:strip(i.description||'').slice(0,180),source:s.name,url:i.link||'',pubDate:new Date(i.pubDate||0)}));
  }));
  const all=res.filter(r=>r.status==='fulfilled').flatMap(r=>r.value).filter(i=>i.title).sort((a,b)=>b.pubDate-a.pubDate).slice(0,7);
  const translated=await Promise.all(all.map(async i=>({...i,title:await translate(i.title)})));
  cSet('wo_news',translated);return translated;
}

// ── Tarihte bugün (Vikipedi) ──
async function loadHist(){
  const today=new Date();
  const m=today.getMonth()+1,d=today.getDate();
  const ck=`hist_${m}_${d}`;
  const c=cGet(ck,43200000);if(c)return c;
  try{
    const r=await fetch(`https://tr.wikipedia.org/api/rest_v1/feed/onthisday/events/${m}/${d}`,{signal:AbortSignal.timeout(8000)});
    const data=await r.json();
    if(data.events&&data.events.length){
      const evts=data.events.sort(()=>Math.random()-.5).slice(0,7).map(e=>({year:e.year,event:e.text}));
      cSet(ck,evts);return evts;
    }
  }catch{}
  // İngilizce fallback + çeviri
  try{
    const r=await fetch(`https://en.wikipedia.org/api/rest_v1/feed/onthisday/events/${m}/${d}`,{signal:AbortSignal.timeout(8000)});
    const data=await r.json();
    if(data.events&&data.events.length){
      const picked=data.events.sort(()=>Math.random()-.5).slice(0,7);
      const evts=await Promise.all(picked.map(async e=>({year:e.year,event:await translate(e.text)})));
      cSet(ck,evts);return evts;
    }
  }catch{}
  return [];
}

// ═══════════════ HALK TAKVİMİ ═══════════════
const FE=[
  {id:'zemheri',name:'Zemheri',emoji:'❄️',startMonth:1,startDay:8,endMonth:2,endDay:8,type:'period',category:'kış',shortDesc:'Yılın en soğuk 40 günü (8 Ocak – 8 Şubat)',fullDesc:'Zemheri, Anadolu geleneğinde yılın en soğuk kırk günlük dönemidir. Ocak\'ın sekizinden Şubat\'ın sekizine kadar sürer. Dondurucu soğuklar, kar fırtınaları ve tipi hüküm sürer. "Zemheri dondu mu, yılkı yavrusu dondu" sözüyle anlatılır. En soğuk güne "göbek zemheri" denir.'},
  {id:'amansiz',name:'Amansız Elli',emoji:'🥶',startMonth:12,startDay:22,endMonth:2,endDay:10,type:'period',category:'kış',shortDesc:'Kışın en sert 50 günü (22 Aralık – 10 Şubat)',fullDesc:'Amansız Elli, kış gündönümünden (22 Aralık) başlayan 50 günlük en sert kış dönemidir. Zemheri\'yi de kapsar; bitiminde baharın müjdecisi Cemreler başlar. "Elli gün kışın amansızı, geçmeden gelmez baharın canı" denir.'},
  {id:'sevgililer',name:'Sevgililer Günü',emoji:'❤️',month:2,day:14,type:'point',category:'kutlama',shortDesc:'14 Şubat — Sevgililer Günü',fullDesc:'Her yıl 14 Şubat\'ta kutlanan Sevgililer Günü, sevgi ve aşkın evrensel sembolüdür. Çiçek, çikolata ve sevgi mesajları paylaşılır.'},
  {id:'bede',name:'Bede Yeli (Vade Yeli)',emoji:'💨',startMonth:2,startDay:19,endMonth:2,endDay:21,type:'period',category:'hava',shortDesc:'Şubat sonunda sert soğuk rüzgar',fullDesc:'"Bede yeli eser, kışın borcunu öder" denir; kış bu rüzgarla son borcunu ödeyerek gider. "Vade Yeli" adıyla da anılır.'},
  {id:'cemre1',name:'1. Cemre — Havaya Düşer',emoji:'🔥',month:2,day:19,type:'point',category:'doğa',shortDesc:'Birinci cemre: Hava ısınır (19–20 Şubat)',fullDesc:'Cemre, baharın gelişini müjdeleyen sembolik ateş parçalarıdır. Birinci cemre havaya düşer; havada ılımlı bir değişim hissedilir. Cemre inancı Orta Asya Türk kültüründen gelir.'},
  {id:'cemre2',name:'2. Cemre — Suya Düşer',emoji:'💧',month:2,day:26,type:'point',category:'doğa',shortDesc:'İkinci cemre: Sular ısınır (26–27 Şubat)',fullDesc:'İkinci cemre suya düşer (26-27 Şubat). Pınar ve akarsuların ısınmaya başladığına inanılır. Donmuş dereler çözülür.'},

function easter(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;return new Date(y,mo-1,da);}
function nthSun(y,m,n){let d=new Date(y,m-1,1),c=0;while(d.getMonth()===m-1){if(d.getDay()===0&&++c===n)return new Date(d);d.setDate(d.getDate()+1);}return null;}

function activeEvts(today,year){
  const ea=easter(year),md=nthSun(year,5,2);
  const dyn=[
    {id:'paskalya',name:'Paskalya',emoji:'🐣',month:ea.getMonth()+1,day:ea.getDate(),type:'point',category:'kutlama',shortDesc:year+' Paskalyası: '+fmtDM(ea),fullDesc:'Paskalya, Hz. İsa\'nın dirilişini kutlayan Hristiyan bayramıdır. '+year+'\'da '+fmtDM(ea)+' tarihindedir.'},
    {id:'anneler',name:'Anneler Günü',emoji:'💐',month:md.getMonth()+1,day:md.getDate(),type:'point',category:'kutlama',shortDesc:"Mayıs'ın ikinci Pazar'ı: "+fmtDM(md),fullDesc:'Anneler Günü, her yıl Mayıs\'ın ikinci Pazar\'ında kutlanır. '+year+'\'da '+fmtDM(md)+' tarihindedir.'},
  ];
  const all=[...FE,...dyn],res=[];
  const tn=new Date(today.getFullYear(),today.getMonth(),today.getDate());
  for(const ev of all){
    let s,e;
    if(ev.type==='point'){let y=year;const t=new Date(y,ev.month-1,ev.day);if(t<new Date(tn.getTime()-15*86400000))y++;s=e=new Date(y,ev.month-1,ev.day);}
    else{let sy=year,ey=year;if(ev.startMonth>ev.endMonth){if(today.getMonth()+1<=ev.endMonth)sy--;else ey++;}s=new Date(sy,ev.startMonth-1,ev.startDay);e=new Date(ey,ev.endMonth-1,ev.endDay);}
    const ds=Math.floor((s-tn)/86400000),de=Math.floor((e-tn)/86400000);
    if(ds<=15&&de>=-15){let st='upcoming';if(ev.type==='period'){if(ds<=0&&de>=0)st='active';else if(de<0)st='past';}else{if(ds===0)st='active';else if(ds<0)st='past';}res.push({...ev,startDate:s,endDate:e,ds,de,status:st});}
  }
  return res.sort((a,b)=>a.ds-b.ds);
}

// ═══════════════ RENDER ═══════════════

function skeleton(){
  return [1,2,3,4].map(i=>`
<div class="sk">
  <div class="sk-line" style="height:11px;width:${20+i*10}%"></div>
  <div class="sk-line" style="height:14px;width:95%"></div>
  <div class="sk-line" style="height:13px;width:${60+i*5}%"></div>
  <div class="sk-line" style="height:11px;width:40%"></div>
</div>`).join('');
}

function renderNews(items,listId){
  const el=document.getElementById(listId);
  if(!items||!items.length){el.innerHTML='<p class="empty">Haber yüklenemedi. Yenile\'ye basın.</p>';return;}
  el.innerHTML=items.map((it,i)=>`
<div class="nc">
  <div class="nc-num">${i+1}</div>
  <div class="nc-body">
    <div class="nc-src-row">
      <span class="nc-src">${it.source}</span>
      <span class="nc-date">${fmtDate(it.pubDate)}</span>
    </div>
    <div class="nc-title" onclick="tSum(this)">${it.title||'—'}</div>
    <div class="nc-sum">${it.summary||''}</div>
    <div class="nc-actions">
      <button class="btn-ozet" onclick="tSum(this.closest('.nc-body').querySelector('.nc-title'))">Özet</button>
      ${it.url&&it.url.startsWith('http')?`<a class="nc-link" href="${it.url}" target="_blank" rel="noopener">Habere Git →</a>`:''}
    </div>
  </div>
</div>`).join('');
}

function tSum(el){
  const b=el.closest('.nc-body'),s=b.querySelector('.nc-sum'),btn=b.querySelector('.btn-ozet'),o=s.classList.toggle('open');
  btn.textContent=o?'Gizle':'Özet';
}

function renderHist(evts){
  const el=document.getElementById('hist-content');
  if(!evts||!evts.length){el.innerHTML='<p class="empty">Tarihsel veri yüklenemedi.</p>';return;}
  el.innerHTML=evts.map(e=>`
<div class="hist-item">
  <span class="hist-year">${e.year}</span>
  <p class="hist-text">${e.event}</p>
</div>`).join('')+`<p class="hist-src">Kaynak: Vikipedi</p>`;
}

function renderFolk(){
  const today=new Date(),el=document.getElementById('folk-content');
  const evts=activeEvts(today,today.getFullYear());
  if(!evts.length){el.innerHTML='<p class="empty">Bu dönemde yakın tarihli takvim olayı yok.</p>';return;}
  const sc=s=>s==='active'?'#c0392b':s==='upcoming'?'#e67e22':'#3a3a3a';
  const sl=ev=>{
    if(ev.status==='active')return ev.type==='period'?(ev.de===0?'Bugün bitiyor':ev.de+' gün daha'):'📌 Bugün!';
    if(ev.status==='upcoming')return ev.ds+' gün sonra';
    return Math.abs(ev.de)+' gün önce bitti';
  };
  el.innerHTML=evts.map(ev=>`
<div class="ev${ev.status==='active'?' act':''}" id="evc-${ev.id}">
  <div class="ev-hd" onclick="tEv('${ev.id}')">
    <span class="ev-ico">${ev.emoji}</span>
    <div class="ev-mt">
      <strong class="ev-nm">${ev.name}</strong>
      <span class="ev-dt">${ev.type==='period'?fmtDM(ev.startDate)+' – '+fmtDM(ev.endDate):fmtDMY(ev.startDate)}</span>
      <span class="ev-sh">${ev.shortDesc}</span>
    </div>
    <span class="ev-bg" style="background:${sc(ev.status)}">${sl(ev)}</span>
    <span class="ev-ch" id="ch-${ev.id}">▼</span>
  </div>
  <div class="ev-bd" id="evb-${ev.id}">
    <p class="ev-fl">${ev.fullDesc}</p>
    <span class="ev-tg">#${ev.category}</span>
  </div>
</div>`).join('');
}

function tEv(id){
  const b=document.getElementById('evb-'+id),c=document.getElementById('ch-'+id);
  const o=b.classList.toggle('open');c.textContent=o?'▲':'▼';c.classList.toggle('open',o);
}

// ═══════════════ KONTROLLER ═══════════════

// Akordeon
const accState={tarihte:false,takvim:false};
function toggleAcc(id){
  accState[id]=!accState[id];
  document.getElementById('body-'+id).classList.toggle('open',accState[id]);
  const ch=document.getElementById('chev-'+id);
  ch.textContent=accState[id]?'▲':'▼';
  ch.classList.toggle('open',accState[id]);
}

// Sekmeler
let curTab='tr';
const panels={tr:'panel-tr',world:'panel-world',all:'panel-all'};
function switchTab(id,btn){
  Object.values(panels).forEach(p=>document.getElementById(p).style.display='none');
  document.getElementById(panels[id]).style.display='block';
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  curTab=id;
}

// Bildirim butonu
let notifGranted=false;
function handleNotif(){
  if(!('Notification' in window)){toast('Bu tarayıcı bildirimleri desteklemiyor.');return;}
  if(Notification.permission==='granted'){toast('🔔 Bildirimler zaten aktif!');notifGranted=true;updateNotifBtn();return;}
  Notification.requestPermission().then(p=>{
    notifGranted=p==='granted';
    updateNotifBtn();
    toast(p==='granted'?'🔔 Bildirimler aktifleştirildi!':'Bildirim izni verilmedi.');
  });
}
function updateNotifBtn(){
  const lbl=document.getElementById('notif-label');
  if(notifGranted){lbl.textContent='Bildirimler Aktif';document.getElementById('btn-notif').style.background='#1a2a1a';}
  else{lbl.textContent='Bildirimler';}
}
function sendNotif(title,body){
  if(notifGranted&&Notification.permission==='granted'){
    try{new Notification(title,{body,icon:'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">📰</text></svg>'});}catch{}
  }
}

// Saat göstergesi
function updateClock(){
  const t=new Date();
  const ts=t.toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'});
  document.getElementById('hdr-time').textContent=ts;
}
setInterval(updateClock,1000);updateClock();

// Toast
let tTimer=null;
function toast(msg){
  const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');
  clearTimeout(tTimer);tTimer=setTimeout(()=>el.classList.remove('show'),3500);
}

// ═══════════════ YÜKLEME ═══════════════

// Veri yükleme durumu
let trData=[],worldData=[];

async function refreshAll(){
  toast('🔄 Güncelleniyor…');
  ['tr_news','wo_news'].forEach(k=>sessionStorage.removeItem('no_'+k));

  // Skeleton göster
  ['tr-list','world-list','all-list'].forEach(id=>document.getElementById(id).innerHTML=skeleton());
  ['pill-tr','pill-world','pill-all'].forEach(id=>{document.getElementById(id).style.display='inline-flex';});

  // Tarihte bugün de yenile
  const today=new Date();
  sessionStorage.removeItem('no_hist_'+(today.getMonth()+1)+'_'+today.getDate());
  document.getElementById('hist-content').innerHTML=skeleton().slice(0,1);

  const[tr,wo,hist]=await Promise.all([loadTR(),loadWorld(),loadHist()]);
  trData=tr;worldData=wo;

  renderNews(tr,'tr-list');
  renderNews(wo,'world-list');
  renderNews([...tr,...wo].sort((a,b)=>new Date(b.pubDate)-new Date(a.pubDate)).slice(0,10),'all-list');
  renderHist(hist);

  ['pill-tr','pill-world','pill-all'].forEach(id=>{document.getElementById(id).style.display='none';});
  const now=new Date().toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'});
  document.getElementById('upd-time').textContent=now;
  toast('✅ Güncellendi');
  sendNotif('Ne Olmuş — Haberler güncellendi','Yeni haberler yüklendi.');
}

// ═══════════════ BAŞLANGIÇ ═══════════════
(async function init(){
  const today=new Date();

  // Tarih badge
  document.getElementById('tarihte-badge').textContent=
    today.toLocaleDateString('tr-TR',{day:'numeric',month:'long'});

  // Maarif Takvimi hemen render et
  renderFolk();

  // İlk yükleme
  ['tr-list','world-list','all-list'].forEach(id=>document.getElementById(id).innerHTML=skeleton());
  ['pill-tr','pill-world','pill-all'].forEach(id=>{document.getElementById(id).style.display='inline-flex';});

  const[tr,wo,hist]=await Promise.all([loadTR(),loadWorld(),loadHist()]);
  trData=tr;worldData=wo;

  renderNews(tr,'tr-list');
  renderNews(wo,'world-list');
  renderNews([...tr,...wo].sort((a,b)=>new Date(b.pubDate)-new Date(a.pubDate)).slice(0,10),'all-list');
  renderHist(hist);

  ['pill-tr','pill-world','pill-all'].forEach(id=>{document.getElementById(id).style.display='none';});
  const now=new Date().toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'});
  document.getElementById('upd-time').textContent=now;

  // Bildirim durumunu kontrol et
  if(Notification.permission==='granted'){notifGranted=true;updateNotifBtn();}

  // Saatlik yenileme
  setInterval(async()=>{
    ['tr_news','wo_news'].forEach(k=>sessionStorage.removeItem('no_'+k));
    ['pill-tr','pill-world','pill-all'].forEach(id=>{document.getElementById(id).style.display='inline-flex';});
    const[t,w]=await Promise.all([loadTR(),loadWorld()]);
    trData=t;worldData=w;
    renderNews(t,'tr-list');
    renderNews(w,'world-list');
    renderNews([...t,...w].sort((a,b)=>new Date(b.pubDate)-new Date(a.pubDate)).slice(0,10),'all-list');
    ['pill-tr','pill-world','pill-all'].forEach(id=>{document.getElementById(id).style.display='none';});
    document.getElementById('upd-time').textContent=new Date().toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'});
    toast('🔔 Saatlik güncelleme yapıldı');
    sendNotif('Ne Olmuş','Saatlik haber güncellemesi yapıldı.');
  },3600000);
})();
