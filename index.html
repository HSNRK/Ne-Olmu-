<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{background:#0a0a0a;color:#e8e4dc;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',sans-serif;min-height:100vh;-webkit-tap-highlight-color:transparent}
button{cursor:pointer;border:none;outline:none;background:none}
a{text-decoration:none;-webkit-tap-highlight-color:transparent}

#hdr{display:flex;align-items:center;gap:10px;padding:12px 14px 10px;background:#0a0a0a;position:sticky;top:0;z-index:200;border-bottom:1px solid #1a1a1a}
.app-title{font-size:26px;font-weight:800;letter-spacing:-.5px;color:#fff;line-height:1}
.hdr-clock{font-size:11px;color:#555;margin-top:2px}
.hdr-r{display:flex;gap:7px;margin-left:auto;flex-shrink:0}
.pill{display:flex;align-items:center;gap:5px;background:#1c1c1e;color:#e8e4dc;padding:7px 11px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap;border:none}

#upd-bar{display:flex;align-items:center;padding:5px 14px;font-size:11px;color:#3a3a3a;border-bottom:1px solid #151515;gap:6px}
#upd-time{color:#555;margin-left:auto}

.acc{border-bottom:1px solid #1a1a1a}
.acc-hd{display:flex;align-items:center;gap:10px;padding:13px 14px;cursor:pointer;user-select:none;-webkit-user-select:none}
.acc-icon{font-size:18px;flex-shrink:0}
.acc-lbl{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#666;flex:1}
.acc-badge{background:#c0392b;color:#fff;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:700}
.acc-chev{color:#444;font-size:12px;flex-shrink:0}
.acc-body{display:none;padding:0 14px 14px}
.acc-body.open{display:block}

#tabs{display:flex;padding:0 14px;background:#0a0a0a;border-bottom:1px solid #1a1a1a;position:sticky;top:67px;z-index:100}
.tab{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;padding:12px 4px;background:transparent;border:none;border-bottom:2px solid transparent;color:#555;font-size:13px;font-weight:600;transition:color .15s,border-color .15s}
.tab.on{border-bottom-color:#c0392b;color:#fff}

#main{padding:0 14px 30px}

.n-head{display:flex;align-items:center;gap:10px;padding:16px 0 12px;border-bottom:1px solid #1a1a1a;margin-bottom:2px}
.n-title{font-size:22px;font-weight:800;letter-spacing:-.3px;color:#fff}

/* SKELETON */
.sk-wrap{padding:14px 0;border-bottom:1px solid #131313}
.sk{background:#1a1a1a;border-radius:5px;animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.6}50%{opacity:.25}}

/* NEWS CARD */
.nc{padding:13px 0;border-bottom:1px solid #131313;display:flex;gap:10px;align-items:flex-start}
.nc-n{min-width:22px;height:22px;border-radius:4px;background:#c0392b;color:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:900;flex-shrink:0;margin-top:3px}
.nc-b{flex:1;min-width:0}
.nc-top{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.nc-src{font-size:9px;font-weight:700;color:#c0392b;text-transform:uppercase;letter-spacing:.05em}
.nc-dt{font-size:9px;color:#333}
.nc-ti{font-size:14px;font-weight:700;line-height:1.45;color:#e8e4dc;cursor:pointer;margin-bottom:5px}
.nc-sm{font-size:12px;line-height:1.7;color:#666;margin-bottom:7px;display:none}
.nc-sm.on{display:block}
.nc-ac{display:flex;gap:8px;align-items:center}
.btn-oz{background:#1a1a1a;color:#777;padding:4px 10px;border-radius:14px;font-size:11px;font-weight:600;border:none;cursor:pointer}
.nc-lk{font-size:11px;color:#c0392b;font-weight:600}

/* HISTORY */
.hi{display:flex;gap:14px;padding:10px 0;border-bottom:1px solid #141414}
.hi-yr{min-width:48px;font-size:20px;font-weight:800;color:#c0392b;flex-shrink:0;line-height:1.2}
.hi-tx{font-size:13px;line-height:1.75;color:#b0aca4}

/* FOLK */
.ev{margin-bottom:8px;border-radius:10px;overflow:hidden;border:1px solid #1c1c1c;background:#111}
.ev.hot{border-color:rgba(192,57,43,.4);background:#120a08}
.ev-hd{display:flex;align-items:center;gap:10px;padding:12px;cursor:pointer;user-select:none;-webkit-user-select:none}
.ev-ic{font-size:22px;min-width:28px}
.ev-mt{flex:1;min-width:0}
.ev-nm{font-size:13px;font-weight:700;display:block;margin-bottom:2px;color:#e8e4dc}
.ev-dt{color:#3a3a3a;font-size:10px;display:block;margin-bottom:1px}
.ev-sh{color:#555;font-size:10px;display:block}
.ev-bg{color:#fff;padding:3px 8px;border-radius:10px;font-size:9px;font-weight:700;white-space:nowrap;flex-shrink:0}
.ev-cv{color:#2e2e2e;font-size:11px;margin-left:4px;flex-shrink:0}
.ev-bd{display:none;padding:0 12px 12px 52px;border-top:1px solid #181818}
.ev-bd.on{display:block}
.ev-fl{font-size:12px;line-height:1.85;color:#888;margin-top:10px}
.ev-tg{display:inline-block;margin-top:6px;background:#1a1a1a;border-radius:3px;padding:2px 6px;font-size:9px;color:#444}

/* TOAST */
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);z-index:9999;
background:#fff;color:#111;padding:10px 20px;border-radius:20px;
font-size:13px;font-weight:600;box-shadow:0 4px 24px rgba(0,0,0,.5);
display:none;white-space:nowrap}
#toast.on{display:block;animation:tup .25s ease}

.empty{color:#444;font-size:13px;padding:20px 0;text-align:center;line-height:1.7}
.err-note{font-size:10px;color:#333;margin-top:6px}

@keyframes tup{from{opacity:0;transform:translateX(-50%) translateY(8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
.d1{animation:blink 1.2s 0s infinite;margin-right:2px}
.d2{animation:blink 1.2s .2s infinite;margin-right:2px}
.d3{animation:blink 1.2s .4s infinite}
</style>

</head>

<script>
/* ═══════════════════════════════════════════
   Ne Olmuş — Güvenilir RSS + Ücretsiz çeviri
   Proxy: allorigins.win (en güvenilir ücretsiz)
   Çeviri: MyMemory API
   Tarih: Wikipedia TR/EN
═══════════════════════════════════════════ */

// ── KAYNAKLAR ──────────────────────────────
const TR_FEEDS=[
  {n:'Hürriyet',   u:'https://www.hurriyet.com.tr/rss/anasayfa'},
  {n:'NTV',        u:'https://www.ntv.com.tr/son-dakika.rss'},
  {n:'Sözcü',      u:'https://www.sozcu.com.tr/rss.xml'},
  {n:'Habertürk',  u:'https://www.haberturk.com/rss'},
];
const WO_FEEDS=[
  {n:'BBC World',  u:'https://feeds.bbci.co.uk/news/world/rss.xml'},
  {n:'Al Jazeera', u:'https://www.aljazeera.com/xml/rss/all.xml'},
  {n:'DW',         u:'https://rss.dw.com/xml/rw_en_top'},
  {n:'Sky News',   u:'https://feeds.skynews.com/feeds/rss/world.xml'},
  {n:'Reuters',    u:'https://feeds.reuters.com/reuters/worldNews'},
];

// ── ÖNBELLEK ───────────────────────────────
const S={
  get:(k,ms=3600000)=>{try{const r=JSON.parse(sessionStorage.getItem('no_'+k));if(r&&Date.now()-r.t<ms)return r.v;}catch{}return null;},
  set:(k,v)=>{try{sessionStorage.setItem('no_'+k,JSON.stringify({v,t:Date.now()}));}catch{}},
  del:(k)=>{try{sessionStorage.removeItem('no_'+k);}catch{}}
};

// ── ARAÇLAR ───────────────────────────────
const esc=s=>{const d=document.createElement('div');d.textContent=s||'';return d.innerHTML;};
const strip=h=>{try{const d=document.createElement('div');d.innerHTML=h||'';return(d.textContent||'').replace(/\s+/g,' ').trim();}catch{return '';}};
const fmtDate=d=>{try{const dt=d instanceof Date?d:new Date(d);if(isNaN(dt))return '';return dt.toLocaleDateString('tr-TR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});}catch{return '';}};
const fmtDM=d=>d.toLocaleDateString('tr-TR',{day:'numeric',month:'long'});
const fmtDMY=d=>d.toLocaleDateString('tr-TR',{day:'numeric',month:'long',year:'numeric'});

// ── RSS ÇEKME (allorigins proxy) ──────────
async function fetchRSS(src){
  // allorigins.win → içeriği JSON olarak döner {contents: "...xml..."}
  const proxyUrl=`https://api.allorigins.win/get?url=${encodeURIComponent(src.u)}&timestamp=${Date.now()}`;
  try{
    const r=await fetch(proxyUrl,{signal:AbortSignal.timeout(10000)});
    if(!r.ok)return[];
    const j=await r.json();
    const xml=j.contents||'';
    if(!xml||xml.length<100)return[];
    return parseRSS(xml,src.n);
  }catch(e){
    console.warn('RSS fetch error',src.n,e.message);
    return[];
  }
}

function parseRSS(xml,name){
  try{
    const doc=new DOMParser().parseFromString(xml,'text/xml');
    // Atom veya RSS
    const items=[...doc.querySelectorAll('item,entry')];
    return items.slice(0,3).map(item=>{
      const title=strip(item.querySelector('title')?.textContent||'');
      // link için önce textContent, yoksa href attr
      let link='';
      const linkEl=item.querySelector('link');
      if(linkEl){link=linkEl.getAttribute('href')||linkEl.textContent?.trim()||'';}
      const desc=strip(
        item.querySelector('description,summary,content\\:encoded,[type="html"]')?.textContent||
        item.querySelector('content')?.textContent||''
      ).slice(0,180);
      const pub=item.querySelector('pubDate,published,updated')?.textContent||'';
      return{title,summary:desc,url:link,source:name,pubDate:new Date(pub||Date.now())};
    }).filter(i=>i.title&&i.title.length>4);
  }catch{return[];}
}

// ── TÜM TÜRK HABERLERİ ────────────────────
async function loadTR(){
  const c=S.get('tr');if(c)return c;
  showLoadMsg('l-tr','Haberler yükleniyor…');
  const res=await Promise.allSettled(TR_FEEDS.map(s=>fetchRSS(s)));
  const all=res.filter(r=>r.status==='fulfilled').flatMap(r=>r.value)
    .filter(i=>i.title).sort((a,b)=>b.pubDate-a.pubDate).slice(0,8);
  if(all.length)S.set('tr',all);
  return all;
}

// ── TÜM DÜNYA HABERLERİ + ÇEVİRİ ─────────
async function translate(text){
  if(!text||text.length<4)return text;
  const clean=text.slice(0,400);
  const ck='tx_'+encodeURIComponent(clean.slice(0,20)).replace(/%/g,'');
  const hit=S.get(ck,86400000);if(hit)return hit;
  try{
    const r=await fetch(
      `https://api.mymemory.translated.net/get?q=${encodeURIComponent(clean)}&langpair=en|tr`,
      {signal:AbortSignal.timeout(7000)}
    );
    const d=await r.json();
    if(d.responseStatus===200&&d.responseData?.translatedText){
      const res=d.responseData.translatedText;
      S.set(ck,res);return res;
    }
  }catch{}
  return text;
}

async function loadWorld(){
  const c=S.get('wo');if(c)return c;
  showLoadMsg('l-wo','Dünya haberleri yükleniyor…');
  const res=await Promise.allSettled(WO_FEEDS.map(s=>fetchRSS(s)));
  const raw=res.filter(r=>r.status==='fulfilled').flatMap(r=>r.value)
    .filter(i=>i.title).sort((a,b)=>b.pubDate-a.pubDate).slice(0,8);
  if(!raw.length)return[];
  const translated=await Promise.all(raw.map(async i=>({...i,title:await translate(i.title)})));
  S.set('wo',translated);
  return translated;
}

// ── TARİHTE BUGÜN ─────────────────────────
async function loadHist(){
  const t=new Date(),m=t.getMonth()+1,d=t.getDate();
  const ck=`hist_${m}_${d}`;
  const c=S.get(ck,43200000);if(c)return c;
  // Türkçe Vikipedi
  try{
    const r=await fetch(`https://tr.wikipedia.org/api/rest_v1/feed/onthisday/events/${m}/${d}`,
      {signal:AbortSignal.timeout(8000)});
    const data=await r.json();
    if(data.events?.length){
      const evts=data.events
        .map(e=>({year:parseInt(e.year)||0,event:e.text}))
        .filter(e=>e.year>0&&e.event)
        .sort((a,b)=>b.year-a.year)   // yakın tarihten uzağa
        .slice(0,12);
      S.set(ck,evts);return evts;
    }
  }catch{}
  // İngilizce Vikipedi + çeviri
  try{
    const r=await fetch(`https://en.wikipedia.org/api/rest_v1/feed/onthisday/events/${m}/${d}`,
      {signal:AbortSignal.timeout(8000)});
    const data=await r.json();
    if(data.events?.length){
      const picked=data.events
        .map(e=>({year:parseInt(e.year)||0,event:e.text}))
        .filter(e=>e.year>0&&e.event)
        .sort((a,b)=>b.year-a.year)
        .slice(0,12);
      const evts=await Promise.all(picked.map(async e=>({year:e.year,event:await translate(e.event)})));
      S.set(ck,evts);return evts;
    }
  }catch{}
  return[];
}

// ═══════════════ HALK TAKVİMİ ═════════════
const FE=[
  {id:'zemheri',name:'Zemheri',emoji:'❄️',sM:1,sD:8,eM:2,eD:8,tp:'p',cat:'kış',sh:'Yılın en soğuk 40 günü (8 Ocak–8 Şubat)',fl:'Zemheri, Anadolu geleneğinde yılın en soğuk kırk günlük dönemidir. Ocak\'ın sekizinden Şubat\'ın sekizine kadar sürer. Dondurucu soğuklar, kar fırtınaları ve tipi hüküm sürer. En soğuk güne "göbek zemheri" denir.'},
  {id:'amansiz',name:'Amansız Elli',emoji:'🥶',sM:12,sD:22,eM:2,eD:10,tp:'p',cat:'kış',sh:'Kışın en sert 50 günü (22 Aralık–10 Şubat)',fl:'Amansız Elli, kış gündönümünden (22 Aralık) başlayan 50 günlük en sert kış dönemidir. Zemheri\'yi de kapsar; bitiminde baharın müjdecisi Cemreler başlar.'},
  {id:'sevgililer',name:'Sevgililer Günü',emoji:'❤️',m:2,d:14,tp:'s',cat:'kutlama',sh:'14 Şubat',fl:'Her yıl 14 Şubat\'ta kutlanan Sevgililer Günü, sevgi ve aşkın evrensel sembolüdür.'},
  {id:'bede',name:'Bede Yeli (Vade Yeli)',emoji:'💨',sM:2,sD:19,eM:2,eD:21,tp:'p',cat:'hava',sh:'Şubat sonunda sert rüzgar (19–21 Şubat)',fl:'"Bede yeli eser, kışın borcunu öder." Kış bu rüzgarla son borcunu ödeyerek gider.'},
  {id:'cemre1',name:'1. Cemre — Havaya Düşer',emoji:'🔥',m:2,d:19,tp:'s',cat:'doğa',sh:'Birinci cemre: Hava ısınır (19–20 Şubat)',fl:'Cemre, baharın gelişini müjdeleyen sembolik ateş parçalarıdır. Birinci cemre havaya düşer. Cemre inancı Orta Asya Türk kültüründen gelir.'},
  {id:'cemre2',name:'2. Cemre — Suya Düşer',emoji:'💧',m:2,d:26,tp:'s',cat:'doğa',sh:'İkinci cemre: Sular ısınır (26–27 Şubat)',fl:'İkinci cemre suya düşer. Pınar ve akarsuların ısınmaya başladığına inanılır; donmuş dereler çözülür.'},
  {id:'cemre3',name:'3. Cemre — Toprağa Düşer',emoji:'🌱',m:3,d:5,tp:'s',cat:'doğa',sh:'Üçüncü cemre: Toprak ısınır (5–6 Mart)',fl:'Üçüncü ve son cemre toprağa düşer. Toprak bu günden sonra ısınır. "Cemre toprağa düştü, bahar kapıda" denir.'},
  {id:'gavur',name:'Gâvurun Küfrü',emoji:'⚡',m:3,d:9,tp:'s',cat:'hava',sh:'Mart\'ta beklenmedik ani soğuk',fl:'"Mart kapıdan baktırır, kazma kürek yaktırır."'},
  {id:'beldir',name:'Kocakarı Soğukları',emoji:'👵❄️',sM:3,sD:11,eM:3,eD:17,tp:'p',cat:'hava',sh:'Mart\'ta 7 günlük fırtına (11–17 Mart)',fl:'"Beldir aciz, yer gök taciz." "Üçü şubatta, dördü martta." Efsaneye göre ihtiyar bir kadın bahar gelince koyunlarını çıkarmış; Mart\'tan ödünç alınan bu günler onu cezalandırmıştır.'},

function easterD(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;return new Date(y,mo-1,da);}
function nthSun(y,m,n){let d=new Date(y,m-1,1),c=0;while(d.getMonth()===m-1){if(d.getDay()===0&&++c===n)return new Date(d);d.setDate(d.getDate()+1);}return null;}

function getEvts(today,year){
  const ea=easterD(year),md=nthSun(year,5,2);
  const dyn=[
    {id:'paskalya',name:'Paskalya',emoji:'🐣',m:ea.getMonth()+1,d:ea.getDate(),tp:'s',cat:'kutlama',sh:year+' Paskalyası: '+fmtDM(ea),fl:'Hz. İsa\'nın dirilişini kutlayan Hristiyan bayramıdır.'},
    {id:'anneler',name:'Anneler Günü',emoji:'💐',m:md.getMonth()+1,d:md.getDate(),tp:'s',cat:'kutlama',sh:"Mayıs'ın ikinci Pazar'ı: "+fmtDM(md),fl:'Her yıl Mayıs\'ın ikinci Pazar\'ında kutlanır.'},
  ];
  const all=[...FE,...dyn],res=[];
  const tn=new Date(today.getFullYear(),today.getMonth(),today.getDate());
  for(const ev of all){
    let s,e;
    if(ev.tp==='s'){let y=year;const t=new Date(y,ev.m-1,ev.d);if(t<new Date(tn-15*86400000))y++;s=e=new Date(y,ev.m-1,ev.d);}
    else{let sy=year,ey=year;if(ev.sM>ev.eM){if(today.getMonth()+1<=ev.eM)sy--;else ey++;}s=new Date(sy,ev.sM-1,ev.sD);e=new Date(ey,ev.eM-1,ev.eD);}
    const ds=Math.floor((s-tn)/86400000),de=Math.floor((e-tn)/86400000);
    if(ds<=15&&de>=-15){
      let st='up';
      if(ev.tp==='p'){if(ds<=0&&de>=0)st='act';else if(de<0)st='old';}
      else{if(ds===0)st='act';else if(ds<0)st='old';}
      res.push({...ev,sDate:s,eDate:e,ds,de,st});
    }
  }
  return res.sort((a,b)=>a.ds-b.ds);
}

// ═══════════════ RENDER ═══════════════════

function skels(n=4){
  return Array.from({length:n},(_,i)=>`
<div class="sk-wrap">
  <div class="sk" style="height:10px;width:${20+i*9}%;margin-bottom:8px"></div>
  <div class="sk" style="height:15px;width:96%;margin-bottom:7px"></div>
  <div class="sk" style="height:12px;width:${55+i*7}%;margin-bottom:6px"></div>
  <div class="sk" style="height:10px;width:30%"></div>
</div>`).join('');
}

function showLoadMsg(id,msg){
  document.getElementById(id).innerHTML=`<div style="padding:20px 0;text-align:center;color:#555;font-size:13px"><span class="d1">●</span><span class="d2">●</span><span class="d3">●</span><br><span style="font-size:11px;color:#333">${msg}</span></div>`;
}

function renderNews(items,lid){
  const el=document.getElementById(lid);
  if(!items||!items.length){
    el.innerHTML=`<div class="empty">Haber yüklenemedi.<br><span class="err-note">Yenile butonuna basın.<br>İnternet bağlantınız açıksa birkaç saniye içinde gelir.</span></div>`;
    return;
  }
  el.innerHTML=items.map((it,i)=>`
<div class="nc">
  <div class="nc-n">${i+1}</div>
  <div class="nc-b">
    <div class="nc-top">
      <span class="nc-src">${esc(it.source)}</span>
      <span class="nc-dt">${fmtDate(it.pubDate)}</span>
    </div>
    <div class="nc-ti" onclick="tSum(this)">${esc(it.title)||'—'}</div>
    <div class="nc-sm">${esc(it.summary)||'Özet için kaynağı ziyaret edin.'}</div>
    <div class="nc-ac">
      <button class="btn-oz" onclick="tSum(this.closest('.nc-b').querySelector('.nc-ti'))">Özet</button>
      ${it.url&&it.url.startsWith('http')?`<a class="nc-lk" href="${esc(it.url)}" target="_blank" rel="noopener">Habere Git →</a>`:''}
    </div>
  </div>
</div>`).join('');
}

function tSum(ti){
  const b=ti.closest('.nc-b'),sm=b.querySelector('.nc-sm'),btn=b.querySelector('.btn-oz');
  const o=sm.classList.toggle('on');btn.textContent=o?'Gizle':'Özet';
}

function renderHist(evts){
  const el=document.getElementById('hist-inner');
  if(!evts||!evts.length){el.innerHTML='<p class="empty">Tarihsel veri yüklenemedi.<br><span class="err-note">Yenile\'ye basın.</span></p>';return;}
  el.innerHTML=evts.map(e=>`
<div class="hi"><span class="hi-yr">${e.year}</span><p class="hi-tx">${esc(e.event)}</p></div>
`).join('')+`<p style="font-size:10px;color:#2a2a2a;margin-top:10px;font-style:italic">Kaynak: Vikipedi · Yakın tarihten uzağa</p>`;
}

function renderFolk(){
  const today=new Date(),y=today.getFullYear();
  const el=document.getElementById('folk-inner');
  const evts=getEvts(today,y);
  if(!evts.length){el.innerHTML='<p class="empty">Bu dönemde yakın tarihli takvim olayı yok.</p>';return;}
  const sc=s=>s==='act'?'#c0392b':s==='up'?'#e67e22':'#333';
  const sl=ev=>{
    if(ev.st==='act')return ev.tp==='p'?(ev.de===0?'Bugün bitiyor':ev.de+' gün daha'):'📌 Bugün!';
    if(ev.st==='up')return ev.ds+' gün sonra';
    return Math.abs(ev.de)+' gün önce bitti';
  };
  el.innerHTML=evts.map(ev=>`
<div class="ev${ev.st==='act'?' hot':''}" id="evc-${ev.id}">
  <div class="ev-hd" onclick="tEv('${ev.id}')">
    <span class="ev-ic">${ev.emoji}</span>
    <div class="ev-mt">
      <strong class="ev-nm">${esc(ev.name)}</strong>
      <span class="ev-dt">${ev.tp==='p'?fmtDM(ev.sDate)+' – '+fmtDM(ev.eDate):fmtDMY(ev.sDate)}</span>
      <span class="ev-sh">${esc(ev.sh)}</span>
    </div>
    <span class="ev-bg" style="background:${sc(ev.st)}">${sl(ev)}</span>
    <span class="ev-cv" id="ecv-${ev.id}">▼</span>
  </div>
  <div class="ev-bd" id="evb-${ev.id}">
    <p class="ev-fl">${esc(ev.fl)}</p>
    <span class="ev-tg">#${ev.cat}</span>
  </div>
</div>`).join('');
}

function tEv(id){
  const b=document.getElementById('evb-'+id),c=document.getElementById('ecv-'+id);
  const o=b.classList.toggle('on');c.textContent=o?'▲':'▼';
}

// ═══════════════ BİLDİRİMLER ══════════════
// iOS Safari Notification API desteklemiyor.
// Bu yüzden IN-APP bildirim (toast) kullanıyoruz.
// "Ana Ekrana Ekle" yapılmış PWA ise gerçek bildirim deniyor.

let notifActive=false;

function handleNotif(){
  // Gerçek Notification API var mı?
  if(!('Notification' in window)){
    // Desteklenmiyor → sadece uygulama içi bildirimleri etkinleştir
    notifActive=true;
    updateNotifUI();
    toast('🔔 Uygulama içi bildirimler aktif!\nSaat başı güncelleme bildirimi alacaksınız.');
    return;
  }
  if(Notification.permission==='granted'){
    notifActive=true;updateNotifUI();
    toast('🔔 Bildirimler zaten aktif!');return;
  }
  if(Notification.permission==='denied'){
    notifActive=true;updateNotifUI();
    toast('🔔 Uygulama içi bildirimler aktif.\nSaatlik güncelleme bildirimi gelecek.');
    return;
  }
  // İzin iste
  Notification.requestPermission().then(p=>{
    notifActive=true;updateNotifUI();
    if(p==='granted'){toast('🔔 Sistem bildirimleri açıldı!');}
    else{toast('🔔 Uygulama içi bildirimler aktif.\nSaatlik güncelleme bildirimi gelecek.');}
  }).catch(()=>{
    notifActive=true;updateNotifUI();
    toast('🔔 Uygulama içi bildirimler aktif!');
  });
}

function updateNotifUI(){
  document.getElementById('notif-lbl').textContent='Aktif ✓';
  document.getElementById('btn-notif').style.background='#1a2e1a';
}

function sendNotif(title,body){
  if(notifActive&&'Notification' in window&&Notification.permission==='granted'){
    try{new Notification(title,{body});}catch{}
  }
  // Her durumda toast göster
  if(notifActive)toast('🔔 '+body);
}

// ═══════════════ SAAT ══════════════════════
function tick(){
  document.getElementById('hdr-clock').textContent=
    new Date().toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'});
}
setInterval(tick,1000);tick();

// ═══════════════ AKORDEÓN & TAB ════════════
const aOpen={hist:false,folk:false};
function toggleAcc(k){
  aOpen[k]=!aOpen[k];
  document.getElementById('body-'+k).classList.toggle('open',aOpen[k]);
  document.getElementById('chev-'+k).textContent=aOpen[k]?'▲':'▼';
}
function switchTab(id,btn){
  ['tr','wo','al'].forEach(t=>{document.getElementById('p-'+t).style.display=t===id?'block':'none';});
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
}

// ═══════════════ TOAST ═════════════════════
let tTmr=null;
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg;el.classList.add('on');
  clearTimeout(tTmr);tTmr=setTimeout(()=>el.classList.remove('on'),4000);
}

// ═══════════════ YÜKLEME ═══════════════════
async function doRefresh(){
  toast('🔄 Güncelleniyor…');
  S.del('tr');S.del('wo');
  const t=new Date();S.del(`hist_${t.getMonth()+1}_${t.getDate()}`);

  document.getElementById('l-tr').innerHTML=skels();
  document.getElementById('l-wo').innerHTML=skels();
  document.getElementById('l-al').innerHTML=skels();
  document.getElementById('hist-inner').innerHTML=skels(3);

  const[tr,wo,hist]=await Promise.all([loadTR(),loadWorld(),loadHist()]);
  renderNews(tr,'l-tr');
  renderNews(wo,'l-wo');
  renderNews([...tr,...wo].sort((a,b)=>b.pubDate-a.pubDate).slice(0,12),'l-al');
  renderHist(hist);

  document.getElementById('upd-time').textContent=
    new Date().toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'});
  toast('✅ Güncellendi — '+tr.length+' TR + '+wo.length+' Dünya haberi');
  sendNotif('Ne Olmuş','Haberler güncellendi.');
}

// ═══════════════ BAŞLANGIÇ ═════════════════
(async()=>{
  const today=new Date();
  document.getElementById('hist-badge').textContent=
    today.toLocaleDateString('tr-TR',{day:'numeric',month:'long'});

  renderFolk();  // takvim anında gelir

  // Skeleton
  document.getElementById('l-tr').innerHTML=skels();
  document.getElementById('l-wo').innerHTML=skels();
  document.getElementById('l-al').innerHTML=skels();

  // Paralel yükle
  const[tr,wo,hist]=await Promise.all([loadTR(),loadWorld(),loadHist()]);

  renderNews(tr,'l-tr');
  renderNews(wo,'l-wo');
  renderNews([...tr,...wo].sort((a,b)=>b.pubDate-a.pubDate).slice(0,12),'l-al');
  renderHist(hist);

  document.getElementById('upd-time').textContent=
    new Date().toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'});

  // Saatlik otomatik yenile
  setInterval(async()=>{
    S.del('tr');S.del('wo');
    const[t,w]=await Promise.all([loadTR(),loadWorld()]);
    renderNews(t,'l-tr');
    renderNews(w,'l-wo');
    renderNews([...t,...w].sort((a,b)=>b.pubDate-a.pubDate).slice(0,12),'l-al');
    document.getElementById('upd-time').textContent=
      new Date().toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'});
    sendNotif('Ne Olmuş','Saatlik güncelleme yapıldı.');
    toast('🔔 Saatlik güncelleme yapıldı');
  },3600000);
})();
